<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花店周年庆 · 朋友圈竖版海报 1080×1440</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS — derived from the flower shop's world ============
     松绿 field：每一束花都有的叶材松柏绿（大面积 C≈0.03，低振动）
     芍药粉 petal：芍药花瓣粉（次级 20–30%）
     剪纸朱红 seal：节庆窗花剪纸红（强调 5–10%，只出现在印章 CTA 与花瓣内层）
     纸 paper：包装纸暖白；墨 ink：绿调墨色，非纯黑                     */
  :root {
    --canvas-w: 1080px;
    --canvas-h: 1440px;

    --c-field:        #1E3D33;  /* 松叶深绿 — 60–70% 大面积底 */
    --c-field-deep:   #16261F;  /* 同色相更深的墨 — 纸带上的文字色 */
    --c-field-soft:   #3D5647;  /* 纸带上的弱化标签色（非事实性文字） */
    --c-petal-pink:   #F2C1C4;  /* 芍药粉 — 花瓣外层 */
    --c-petal-rose:   #E7A7AE;  /* 深一层的粉 — 花瓣外层交替 */
    --c-seal-red:     #C33A2E;  /* 剪纸朱红 — 花瓣内层 + CTA 印章 */
    --c-paper:        #F6EEDF;  /* 包装纸暖白 — 文字与分隔纸层 */
    --c-paper-dim:    #EFE3CC;  /* 纸层第二层（剪纸叠纸层次） */

    --f-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
    --f-text:    "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { margin: 0; padding: 0; }
  html, body { background: var(--c-field); }

  /* ============ CANVAS 1080×1440（即整页，便于精确验证） ============ */
  .poster {
    position: relative;
    width: var(--canvas-w);
    height: var(--canvas-h);
    background: var(--c-field);
    overflow: hidden;
    font-family: var(--f-text);
  }

  /* ---- 剪纸窗花（店名悬于花窗中心） ---- */
  .rosette {
    position: absolute;
    top: 160px; left: 230px;
    width: 620px; height: 620px;
  }
  .shop-slot {
    position: absolute;
    top: 452px; left: 0; right: 0;
    text-align: center;
    color: var(--c-paper);
    font-weight: 700;
    font-size: 36px;
    letter-spacing: 0.06em;
    line-height: 1;
  }

  /* ---- 巨字主标题 + 副语 ---- */
  .headline {
    position: absolute;
    top: 804px; left: 0; right: 0;
    text-align: center;
    font-family: var(--f-display);
    font-weight: 900;
    font-size: 260px;
    letter-spacing: 0.02em;
    line-height: 1;
    color: var(--c-paper);
    text-wrap: balance;
  }
  .subline {
    position: absolute;
    top: 1096px; left: 0; right: 0;
    text-align: center;
    color: var(--c-paper);
    font-size: 36px;
    font-weight: 400;
    letter-spacing: 0.12em;
    line-height: 1;
  }

  /* ---- 纸带分隔：剪纸叠纸扇形边 ---- */
  .scallop { position: absolute; top: 1164px; left: 0; width: 1080px; height: 60px; }

  /* ---- 底区：纸色信息带 ---- */
  .band {
    position: absolute;
    top: 1196px; left: 0; right: 0; bottom: 0;
    background: var(--c-paper);
  }
  .offer-slot {
    position: absolute;
    top: 28px; left: 72px;
    font-family: var(--f-display);
    font-weight: 900;
    font-size: 56px;
    line-height: 1;
    color: var(--c-field-deep);
  }
  .fact-line { position: absolute; left: 72px; line-height: 1; white-space: nowrap; }
  .fact-label {
    display: inline-block;
    width: 148px;
    color: var(--c-field-soft);
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.08em;
  }
  .fact-value { color: var(--c-field-deep); font-size: 36px; font-weight: 700; letter-spacing: 0.02em; }
  .fact-when  { top: 104px; }
  .fact-where { top: 156px; }

  /* ---- CTA 印章：唯一的 5–10% 朱红强调，压在纸缝上（盖章动作） ---- */
  .cta-seal {
    position: absolute;
    right: 64px; bottom: 56px;
    width: 200px; height: 200px;
    background: var(--c-seal-red);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .cta-seal::after {           /* 印章内沿 */
    content: "";
    position: absolute;
    inset: 10px;
    border: 3px solid var(--c-paper);
    border-radius: 8px;
  }
  .cta-text {
    writing-mode: vertical-rl;
    font-family: var(--f-display);
    font-weight: 900;
    font-size: 48px;
    line-height: 1.25;
    letter-spacing: 0.04em;
    height: 124px;              /* 2 字 × 48 × 1.25 + 余量 → 强制 2×2 印章排布 */
    color: var(--c-paper);
  }
</style>
</head>
<body>
  <div class="poster" role="img" aria-label="花店周年庆促销海报：剪纸窗花花环中央悬店名，下方大字周年庆，底部纸带为促销内容、活动时间、店址与进店印章">

    <!-- 中区：剪纸窗花（16 外层粉瓣 × 8 深粉瓣 × 12 内层红瓣；中空为“窗”，店名悬于其中） -->
    <svg class="rosette" viewBox="0 0 620 620" aria-hidden="true">
      <defs>
        <path id="petalA" d="M310 140 C 366 106, 370 50, 310 4 C 250 50, 254 106, 310 140 Z"/>
        <path id="petalB" d="M310 138 C 366 106, 368 52, 310 6 C 252 52, 254 106, 310 138 Z"/>
        <path id="petalC" d="M310 192 C 356 166, 358 120, 310 86 C 262 120, 264 166, 310 192 Z"/>
        <path id="petalD" d="M310 190 C 348 166, 350 122, 310 88 C 272 122, 272 166, 310 190 Z"/>
      </defs>
      <!-- 窗框细线（画在花瓣之后层之下：只在瓣间露出） -->
      <circle cx="310" cy="310" r="216" fill="none" stroke="#F6EEDF" stroke-width="3"/>
      <!-- 外层：芍药粉 16 瓣（两种瓣形交替 = 手剪感） -->
      <g fill="#F2C1C4">
        <use href="#petalA" transform="rotate(0 310 310)"/>
        <use href="#petalB" transform="rotate(22.5 310 310)"/>
        <use href="#petalA" transform="rotate(45 310 310)"/>
        <use href="#petalB" transform="rotate(67.5 310 310)"/>
        <use href="#petalA" transform="rotate(90 310 310)"/>
        <use href="#petalB" transform="rotate(112.5 310 310)"/>
        <use href="#petalA" transform="rotate(135 310 310)"/>
        <use href="#petalB" transform="rotate(157.5 310 310)"/>
        <use href="#petalA" transform="rotate(180 310 310)"/>
        <use href="#petalB" transform="rotate(202.5 310 310)"/>
        <use href="#petalA" transform="rotate(225 310 310)"/>
        <use href="#petalB" transform="rotate(247.5 310 310)"/>
        <use href="#petalA" transform="rotate(270 310 310)"/>
        <use href="#petalB" transform="rotate(292.5 310 310)"/>
        <use href="#petalA" transform="rotate(315 310 310)"/>
        <use href="#petalB" transform="rotate(337.5 310 310)"/>
      </g>
      <!-- 深粉 8 瓣（介于外层瓣之间的层次） -->
      <g fill="#E7A7AE">
        <use href="#petalB" transform="rotate(11.25 310 310)"/>
        <use href="#petalB" transform="rotate(56.25 310 310)"/>
        <use href="#petalB" transform="rotate(101.25 310 310)"/>
        <use href="#petalB" transform="rotate(146.25 310 310)"/>
        <use href="#petalB" transform="rotate(191.25 310 310)"/>
        <use href="#petalB" transform="rotate(236.25 310 310)"/>
        <use href="#petalB" transform="rotate(281.25 310 310)"/>
        <use href="#petalB" transform="rotate(326.25 310 310)"/>
      </g>
      <!-- 内层：剪纸朱红 12 瓣（瓣尖抵住窗框，叠纸层次） -->
      <g fill="#C33A2E">
        <use href="#petalC" transform="rotate(0 310 310)"/>
        <use href="#petalD" transform="rotate(30 310 310)"/>
        <use href="#petalC" transform="rotate(60 310 310)"/>
        <use href="#petalD" transform="rotate(90 310 310)"/>
        <use href="#petalC" transform="rotate(120 310 310)"/>
        <use href="#petalD" transform="rotate(150 310 310)"/>
        <use href="#petalC" transform="rotate(180 310 310)"/>
        <use href="#petalD" transform="rotate(210 310 310)"/>
        <use href="#petalC" transform="rotate(240 310 310)"/>
        <use href="#petalD" transform="rotate(270 310 310)"/>
        <use href="#petalC" transform="rotate(300 310 310)"/>
        <use href="#petalD" transform="rotate(330 310 310)"/>
      </g>
    </svg>

    <div class="shop-slot">[店名]</div>

    <h1 class="headline">周年庆</h1>
    <p class="subline">一年只此一次</p>

    <!-- 纸带分隔：两层扇形纸边（红层在后、粉层在前） -->
    <svg class="scallop" viewBox="0 0 1080 60" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#C33A2E" transform="translate(0 16)" d="M0 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 Z"/>
      <path fill="#F2C1C4" d="M0 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 a30 30 0 0 0 60 0 Z"/>
    </svg>

    <!-- 底区纸带 -->
    <div class="band">
      <div class="offer-slot">[促销主打]</div>
      <div class="fact-line fact-when"><span class="fact-label">活动时间</span><span class="fact-value">[X月X日 — X月X日]</span></div>
      <div class="fact-line fact-where"><span class="fact-label">到店</span><span class="fact-value">[店址]</span></div>
      <div class="cta-seal"><span class="cta-text">进店挑花</span></div>
    </div>

  </div>
</body>
</html>
