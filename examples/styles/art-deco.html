<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fern — landing hero · Art Deco</title>
<meta name="description" content="Style-recipe demo: Fern plant-care hero in the Art Deco recipe.">
<!--
  RECIPE: knowledge/styles/art-deco.md
  MODE: Art Deco (style recipe) — same brief and copy as the other 17 specimens.
  MADE BY: Doubao agent session, 2026-11-17. HTML/CSS composed here; rendered by
           scripts/shoot.mjs with a local Chrome over CDP. No AI-generated imagery.
  Palette: warm black #171310 ~55% / antique gold #C9A227 ~20% / emerald #0F5C4E ~12% /
           ivory #F3ECDC ~10%. Gold is flat foil, one sheen, never a gradient.
  Contrast: ivory on black 15.9:1; gold on black 7.7:1; emerald on black 2.9:1
            (decorative frame only, no text); gold button label on black 7.7:1.
  Type: Cinzel 600 + Josefin Sans 400/600 (three weights total). Scale 1.333:
        16 / 21 / 28 / 38 / 50 / 67; caps +0.15em, stacked pyramids.
  Layout: exact vertical symmetry, stepped frame, sunburst from one point,
          ornamental divider (diamond · rule · diamond).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Josefin+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#171310;
    --gold:#C9A227;
    --emerald:#0F5C4E;
    --ivory:#F3ECDC;
  }
  *{box-sizing:border-box}
  html,body{margin:0;overflow-x:clip}
  body{
    background:var(--black);color:var(--ivory);
    font:400 16px/1.55 "Josefin Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,p{margin:0}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--gold);outline-offset:4px}

  .page{position:relative;width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}

  /* ornamental frame drawn once, in SVG, so symmetry is exact */
  .frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .frame svg{display:block;width:100%;height:100%}

  header{position:relative;z-index:1;width:100%;padding:44px 64px 0;text-align:center}
  .wordmark{font:600 18px/1 "Cinzel",Georgia,serif;letter-spacing:.42em;color:var(--gold)}
  nav{display:flex;justify-content:center;gap:28px;margin-top:16px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:rgba(243,236,220,.72)}
  nav a{padding-block:6px}
  nav .dot{color:var(--gold)}

  main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 96px 40px;text-align:center}
  .eyebrow{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:28px}
  h1{
    font:600 67px/1.06 "Cinzel",Georgia,serif;letter-spacing:.055em;
    text-transform:uppercase;max-width:12ch;text-wrap:balance;
  }
  h1 span{display:block}
  .lead{font:400 17px/1.65 "Josefin Sans",system-ui,sans-serif;color:rgba(243,236,220,.82);max-width:44ch;margin-top:26px;text-wrap:pretty}

  .divider{display:flex;align-items:center;gap:14px;margin:30px 0 34px;color:var(--gold)}
  .divider .rule{width:176px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .diamond{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 0 3px rgba(201,162,39,.12)}
  .diamond.small{width:4px;height:4px;background:transparent;border:1px solid var(--gold);box-shadow:none}

  .cta{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:54px;padding:0 38px;border:1px solid var(--gold);border-radius:0;
    font:600 13px/1 "Josefin Sans",sans-serif;letter-spacing:.24em;text-transform:uppercase;
    background:var(--black);color:var(--ivory);
    transition:background-color 500ms ease-out,color 500ms ease-out;
  }
  .cta:hover,.cta:focus-visible{background:var(--gold);color:var(--black)}

  footer{position:relative;z-index:1;width:100%;padding:0 64px 46px;display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(243,236,220,.62)}
  footer .center{color:var(--gold)}
  footer .folio{font-variant-numeric:tabular-nums}

  /* one slow luxury entrance, nothing bounces */
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .eyebrow{animation:rise 600ms cubic-bezier(.22,.61,.36,1) both}
  h1{animation:rise 700ms cubic-bezier(.22,.61,.36,1) 120ms both}
  .lead{animation:rise 700ms cubic-bezier(.22,.61,.36,1) 240ms both}
  .divider,.cta{animation:rise 700ms cubic-bezier(.22,.61,.36,1) 360ms both}

  @media (prefers-reduced-motion: reduce){
    .eyebrow,h1,.lead,.divider,.cta{animation:none}
    .cta{transition:none}
  }
</style>
</head>
<body>
<div class="page">

  <div class="frame" aria-hidden="true">

      <!-- sunburst: 32 rays from the focal point, one motif family only -->

        <line x1="720" y1="454" x2="720" y2="120"/>

        <line x1="720" y1="454" x2="360" y2="648"/>

        <line x1="720" y1="454" x2="304" y2="370"/>
        <line x1="720" y1="454" x2="360" y2="260"/>
        <line x1="720" y1="454" x2="456" y2="176"/>
        <line x1="720" y1="454" x2="580" y2="132"/>
      </g>
      <circle cx="720" cy="454" r="250" fill="none" stroke="#C9A227" stroke-width="1" opacity=".18"/>
      <circle cx="720" cy="454" r="342" fill="none" stroke="#C9A227" stroke-width="1" opacity=".12"/>

      <!-- stepped ziggurat frame -->
      <g fill="none" stroke="#C9A227">
        <rect x="26" y="26" width="1388" height="848" stroke-width="1.5"/>
        <rect x="40" y="40" width="1360" height="820" stroke-width=".75" opacity=".55"/>
        <path d="M26 88 H88 V26" stroke-width="3"/>

        <path d="M1414 812 V874 H1352" stroke-width="3"/>
        <!-- tiered corner steps -->
        <path d="M64 26 V64 H26" stroke-width="1" opacity=".7"/>

        <path d="M64 874 V836 H26" stroke-width="1" opacity=".7"/>
        <path d="M1376 874 V836 H1414" stroke-width="1" opacity=".7"/>
      </g>
      <!-- one emerald jewel tone, in the frame only -->
      <rect x="712" y="22" width="16" height="16" transform="rotate(45 720 30)" fill="#0F5C4E" stroke="#C9A227" stroke-width="1"/>
      <rect x="712" y="862" width="16" height="16" transform="rotate(45 720 870)" fill="#0F5C4E" stroke="#C9A227" stroke-width="1"/>
    </svg>
  </div>

  <header>
    <a class="wordmark" href="#">FERN</a>
    <nav aria-label="Product areas">
      <a href="#">Reminders</a><span class="dot">·</span>
      <a href="#">Plant ID</a><span class="dot">·</span>
      <a href="#">Experts</a>
    </nav>
  </header>

  <main>
    <p class="eyebrow">Plant care, ornamented</p>
    <h1><span>Plant care</span><span>that runs</span><span>itself</span></h1>
    <p class="lead">Care reminders, plant identification, and expert help in one app.</p>

    <div class="divider" aria-hidden="true">
      <span class="diamond small"></span><span class="rule"></span><span class="diamond"></span><span class="rule"></span><span class="diamond small"></span>
    </div>

    <a class="cta" href="#">Start your free week</a>
  </main>

  <footer>
    <p>Fern — plant-care subscription</p>
    <p class="center">MMXXVI</p>
    <p class="folio">07 / 18</p>
  </footer>

</div>
</body>
</html>
