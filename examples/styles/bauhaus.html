<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fern — landing hero · Bauhaus</title>
<meta name="description" content="Style-recipe demo: Fern plant-care hero in the Bauhaus recipe.">
<!--
  RECIPE: knowledge/styles/bauhaus.md
  MODE: Bauhaus (style recipe) — same brief and copy as the other 17 specimens.
  MADE BY: Doubao agent session, 2026-11-17. HTML/CSS composed here; rendered by
           scripts/shoot.mjs with a local Chrome over CDP. No AI-generated imagery.
  Palette: paper #F2EFE8 ~55% / cadmium red #D2372C ~15% / chrome yellow #F2B807 ~10% /
           cobalt blue #1D53C4 ~10% / ink #191919 ~10%. Flat fills only.
  Contrast: ink on paper 14.1:1; paper on ink 14.1:1; red on paper 4.6:1 (large shapes
            and the 76px word only); blue on paper 6.4:1; yellow is non-text.
  Type: Jost 400/500/700 — one family, three weights. Scale 1.414: 16 / 23 / 32 / 45 / 64,
        headline pushed to 76px so type becomes geometry.
  Layout: strict grid cut by ONE 45° diagonal; three large masses; shapes bleed off-canvas;
          calculated asymmetry, heavy right against airy left.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EFE8;
    --red:#D2372C;
    --yellow:#F2B807;
    --blue:#1D53C4;
    --ink:#191919;
  }
  *{box-sizing:border-box}
  html,body{margin:0;overflow-x:clip}
  body{background:var(--paper);color:var(--ink);font:400 16px/1.5 "Jost",system-ui,sans-serif}
  h1,p{margin:0}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:3px solid var(--blue);outline-offset:3px}

  .page{position:relative;min-height:100vh;overflow:hidden}

  .top{display:flex;align-items:flex-start;justify-content:space-between;padding:40px 64px 0;position:relative;z-index:3}
  .brand{display:flex;align-items:center;gap:16px}
  .mark{width:56px;height:56px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:700 24px/1 "Jost",sans-serif}
  .wordmark{font:700 18px/1 "Jost",sans-serif;letter-spacing:.18em}
  nav{display:flex;gap:32px;font:500 14px/1 "Jost",sans-serif;padding-top:20px}
  nav a{padding-block:6px;border-bottom:2px solid transparent;transition:border-color 160ms linear}
  nav a:hover,nav a:focus-visible{border-bottom-color:var(--red)}

  .hero{position:relative;height:636px}

  /* three geometric masses, cropped by the canvas */
  .mass{position:absolute;z-index:2}
  .circle{width:470px;height:470px;border-radius:50%;background:var(--red);right:-110px;top:56px;animation:enter 520ms cubic-bezier(.2,.7,.3,1) both}
  .tri{width:460px;height:430px;background:var(--blue);right:40px;bottom:-150px;clip-path:polygon(50% 0,100% 100%,0 100%);animation:enter 520ms cubic-bezier(.2,.7,.3,1) 80ms both}
  .bar{width:92px;height:600px;background:var(--yellow);right:300px;top:60px;mix-blend-mode:multiply;animation:enter 520ms cubic-bezier(.2,.7,.3,1) 160ms both}
  .diag{position:absolute;width:1280px;height:16px;background:var(--ink);left:470px;top:646px;transform:rotate(-33deg);transform-origin:left center;z-index:1}
  .fulcrum{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--red);left:906px;top:358px;z-index:3}

  .copy{position:absolute;left:96px;top:74px;width:650px;z-index:3}
  .kicker{display:flex;align-items:center;gap:12px;font:500 12px/1 "Jost",sans-serif;letter-spacing:.24em;text-transform:uppercase;margin-bottom:30px}
  .kicker::before{content:"";width:48px;height:3px;background:var(--red)}
  h1{
    font:700 76px/.94 "Jost",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.005em;
    max-width:10ch;
  }
  h1 span{display:block}
  .lead{font:400 17px/1.55 "Jost",sans-serif;max-width:38ch;margin-top:30px}
  .cta{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:56px;min-width:236px;margin-top:38px;padding:0 28px;
    background:var(--ink);color:var(--paper);border:0;
    font:500 15px/1 "Jost",sans-serif;letter-spacing:.1em;text-transform:uppercase;
    transition:background-color 160ms linear;
  }
  .cta:hover,.cta:focus-visible{background:var(--red)}

  footer{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:22px 64px 26px;border-top:1px solid var(--ink);background:var(--paper);font:500 12px/1 "Jost",sans-serif;letter-spacing:.18em;text-transform:uppercase}
  footer .folio{font-variant-numeric:tabular-nums}

  @keyframes enter{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    .circle,.tri,.bar{animation:none}
    .cta,nav a{transition:none}
  }
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">F</span>
      <span class="wordmark">FERN</span>
    </div>
    <nav aria-label="Product areas">
      <a href="#">Reminders</a>
      <a href="#">Plant ID</a>
      <a href="#">Experts</a>
    </nav>
  </header>

  <main class="hero">
    <div class="mass circle" aria-hidden="true"></div>
    <div class="mass tri" aria-hidden="true"></div>
    <div class="mass bar" aria-hidden="true"></div>
    <div class="diag" aria-hidden="true"></div>
    <div class="fulcrum" aria-hidden="true"></div>

    <div class="copy">
      <p class="kicker">A plant-care system · Bauhaus 1919</p>
      <h1><span>Plant care</span><span>that runs</span><span>itself.</span></h1>
      <p class="lead">Care reminders, plant identification, and expert help in one app.</p>
      <a class="cta" href="#">Start your free week</a>
    </div>
  </main>

  <footer>
    <span>Fern — plant-care subscription</span>
    <span class="folio">08 / 18</span>
  </footer>

</div>
</body>
</html>
