<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>飞天 · 散花梦</title>
<meta name="description" content="敦煌飞天主题二维网页游戏——夜航鸣沙，莲灯金铃，一舞散花。">
<style>
/* ---------- tokens ---------- */
:root{
  --ink:#120d17;
  --ink-2:#1a1424;
  --ivory:#e9dfc8;
  --ivory-dim:#cfc4ab;
  --gold:#d9a441;
  --gold-bright:#f2c968;
  --gold-pale:#f7e3ad;
  --cinnabar:#c0402c;
  --cinnabar-bright:#e6765e;
  --cinnabar-deep:#8a2a1e;
  --azurite:#4a7ba6;
  --malachite:#5e8c6a;
  --hairline:rgba(217,164,65,.38);
  --hairline-soft:rgba(217,164,65,.18);
  --font-kai:'KaiTi','STKaiti','BiauKai','DFKai-SB','Noto Serif SC','Songti SC',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--ink)}
body{font-family:var(--font-kai);color:var(--ivory);-webkit-font-smoothing:antialiased}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;transition:filter .22s ease-out}
/* ---------- generic ---------- */
button{font-family:var(--font-kai);cursor:pointer;background:none;color:var(--ivory);border:none}
button:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;border-radius:2px}
.btn{
  display:inline-block;border:1px solid var(--hairline);padding:15px 44px 15px 52px;
  font-size:19px;letter-spacing:.55em;color:var(--gold-pale);background:rgba(18,13,23,.35);
  transition:background-color .16s ease-out,color .16s ease-out,transform .16s ease-out;
}
.btn:hover{background:var(--gold);color:var(--ink)}
.btn:active{transform:scale(.97)}
/* ---------- title ---------- */
#ui-title{
  position:fixed;inset:0;z-index:30;display:flex;align-items:center;
  background:rgba(10,8,15,.46);transition:opacity .32s ease-out;
}
#ui-title.is-hidden{opacity:0;pointer-events:none}
.title-block{margin-left:clamp(24px,9vw,150px);display:flex;gap:clamp(18px,3vw,40px);align-items:flex-start}
.title-main{
  writing-mode:vertical-rl;font-size:clamp(88px,24vh,190px);line-height:1;
  color:var(--gold-pale);letter-spacing:.14em;font-weight:400;
  text-shadow:0 2px 26px rgba(242,201,104,.28);user-select:none;
}
.title-side{display:flex;flex-direction:column;gap:18px;padding-top:10px}
.title-sub{font-size:clamp(15px,2.2vh,19px);letter-spacing:.62em;color:var(--ivory-dim);writing-mode:vertical-rl}
.seal{
  width:clamp(44px,7vh,60px);height:clamp(44px,7vh,60px);background:var(--cinnabar);
  color:#ffffff;display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;font-size:clamp(17px,2.8vh,23px);letter-spacing:.1em;line-height:1;
  transform:rotate(-2.5deg);box-shadow:0 2px 10px rgba(138,42,30,.4);user-select:none;
}
.title-actions{display:flex;flex-direction:column;gap:14px;align-items:flex-start;margin-top:8px}
.title-hints{font-size:13px;color:var(--ivory-dim);letter-spacing:.18em;line-height:2}
.title-best{font-size:13px;color:var(--gold);letter-spacing:.22em}
.title-note{position:absolute;left:24px;bottom:18px;font-size:12px;color:rgba(207,196,171,.62);letter-spacing:.2em}
@media (max-width:600px){
  .title-block{margin-left:6vw;flex-direction:column;gap:16px}
  .title-side{flex-direction:row;align-items:center;gap:18px;padding-top:0}
  .title-sub{writing-mode:horizontal-tb;letter-spacing:.5em}
}
/* ---------- HUD ---------- */
#ui-hud{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .4s ease-out}
#ui-hud.is-on{opacity:1}
.hud-lives{position:absolute;top:18px;left:22px;display:flex;gap:10px}
.hud-lives svg{width:26px;height:26px;transition:opacity .3s ease-out,filter .3s ease-out}
.hud-lives svg.lost{opacity:.18;filter:grayscale(1)}
.hud-score{position:absolute;top:12px;left:50%;transform:translateX(-50%);text-align:center}
.hud-score-num{font-size:clamp(26px,4.5vh,34px);color:var(--ivory);letter-spacing:.08em;line-height:1.15}
.hud-dist{font-size:12px;color:var(--ivory-dim);letter-spacing:.3em;margin-top:2px}
.hud-combo{position:absolute;top:16px;left:calc(50% + 110px);font-size:15px;color:var(--gold-pale);letter-spacing:.2em;opacity:0;transition:opacity .2s ease-out}
.hud-combo.is-on{opacity:1}
@media (max-width:600px){.hud-combo{top:58px;left:50%;margin-left:-2em}}
.hud-meter{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px}
.hud-meter-label{font-size:13px;letter-spacing:.3em;color:var(--ivory-dim)}
.hud-meter-track{width:min(220px,44vw);height:4px;background:var(--hairline-soft);position:relative;overflow:hidden}
.hud-meter-fill{position:absolute;inset:0;background:var(--gold);transform-origin:left center;transform:scaleX(0)}
.hud-meter.is-full .hud-meter-label{color:var(--gold-bright)}
.hud-meter.is-full .hud-meter-track{box-shadow:0 0 12px rgba(242,201,104,.5)}
.hud-topright{position:absolute;top:14px;right:16px;display:flex;gap:10px;pointer-events:auto}
.icon-btn{
  width:44px;height:44px;border:1px solid var(--hairline);color:var(--ivory-dim);font-size:17px;
  letter-spacing:0;background:rgba(18,13,23,.4);transition:background-color .16s ease-out,color .16s ease-out;
}
.icon-btn:hover{background:var(--gold);color:var(--ink)}
#btn-sanhua{
  position:fixed;right:22px;bottom:24px;z-index:25;width:72px;height:72px;border-radius:50%;
  border:1px solid var(--hairline);color:var(--gold-pale);font-size:26px;background:rgba(18,13,23,.55);
  display:none;transition:transform .16s ease-out,background-color .16s ease-out,opacity .2s ease-out;
}
#btn-sanhua:active{transform:scale(.95)}
#btn-sanhua.is-ready{border-color:var(--gold-bright);color:var(--ink);background:var(--gold-bright)}
#btn-sanhua[aria-disabled="true"]{opacity:.45}
@media (pointer:coarse){#btn-sanhua.is-visible{display:block}}
.space-hint{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:.34em;color:var(--ivory-dim);opacity:0;transition:opacity .5s ease-out}
.space-hint.is-on{opacity:.85}
/* ---------- pause ---------- */
#ui-pause{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;background:rgba(10,8,15,.62)}
#ui-pause.is-on{display:flex}
.pause-box{text-align:center;display:flex;flex-direction:column;gap:26px;align-items:center}
.pause-word{font-size:44px;letter-spacing:.7em;color:var(--ivory);padding-left:.7em}
/* ---------- end ---------- */
#ui-end{position:fixed;inset:0;z-index:34;display:none;align-items:center;justify-content:center;background:rgba(10,8,15,.55)}
#ui-end.is-on{display:flex}
.end-plaque{
  width:min(430px,90vw);border:1px solid var(--hairline);background:rgba(20,14,26,.92);
  padding:clamp(28px,5vh,44px) clamp(28px,4vw,44px);position:relative;
}
.end-plaque::after{content:'';position:absolute;inset:7px;border:1px solid var(--hairline-soft);pointer-events:none}
.end-word{font-size:38px;letter-spacing:.5em;color:var(--gold-pale);text-align:center;padding-left:.5em}
.end-record{text-align:center;font-size:13px;color:var(--cinnabar-bright);letter-spacing:.3em;margin-top:8px;min-height:18px}
.end-stats{margin:26px 0 30px;display:flex;flex-direction:column}
.end-row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--hairline-soft)}
.end-row:first-child{border-bottom:1px solid var(--hairline)}
.end-row .k{font-size:14px;color:var(--ivory-dim);letter-spacing:.28em}
.end-row .v{font-size:24px;color:var(--ivory)}
.end-row.hero .v{font-size:40px;color:var(--gold-pale)}
.end-actions{text-align:center}
/* ---------- mute ---------- */
#btn-mute{position:fixed;right:18px;bottom:18px;z-index:40;width:44px;height:44px;font-size:16px;
  border:1px solid var(--hairline);background:rgba(18,13,23,.4);color:var(--ivory-dim);
  transition:background-color .16s ease-out,color .16s ease-out}
#btn-mute:hover{background:var(--gold);color:var(--ink)}
#btn-mute.is-muted{color:rgba(207,196,171,.45);text-decoration:line-through}
#btn-mute.is-behind{bottom:auto;top:14px;right:72px}
noscript{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ivory);font-size:18px;letter-spacing:.2em;z-index:99;background:var(--ink)}
@media (prefers-reduced-motion:reduce){
  .btn,.icon-btn,#btn-mute{transition:none}
}
</style>
</head>

<!-- 标题层 -->

    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c2.6 3.4 3.8 6.6 3.8 9.6 0 3.6-1.7 6.2-3.8 8.4-2.1-2.2-3.8-4.8-3.8-8.4C8.2 9.6 9.4 6.4 12 3z" fill="#d9a441"/><path d="M12 21c-3.2-.6-5.6-2.4-7.2-5.4 3-.4 5.2.2 7.2 5.4z" fill="#5e8c6a"/><path d="M12 21c3.2-.6 5.6-2.4 7.2-5.4-3-.4-5.2.2-7.2 5.4z" fill="#5e8c6a"/></svg>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c2.6 3.4 3.8 6.6 3.8 9.6 0 3.6-1.7 6.2-3.8 8.4-2.1-2.2-3.8-4.8-3.8-8.4C8.2 9.6 9.4 6.4 12 3z" fill="#d9a441"/><path d="M12 21c-3.2-.6-5.6-2.4-7.2-5.4 3-.4 5.2.2 7.2 5.4z" fill="#5e8c6a"/><path d="M12 21c3.2-.6 5.6-2.4 7.2-5.4-3-.4-5.2.2-7.2 5.4z" fill="#5e8c6a"/></svg>

</div>
<button id="btn-sanhua" type="button" aria-disabled="true" aria-label="散花">散</button>

<!-- 暂停 -->
<div id="ui-pause">

<script>
(function(){
'use strict';
/* 调试浮层：?debug=1 时把未捕获异常显示在页面上 */
window.addEventListener('error',function(e){
  if(location.search.indexOf('debug')<0)return;
  var el=document.getElementById('errbox');
  if(!el){el=document.createElement('pre');el.id='errbox';
    el.style.cssText='position:fixed;top:0;left:0;z-index:999;background:#3a0e0e;color:#ffe;padding:10px;font:12px/1.6 monospace;max-width:92vw;white-space:pre-wrap';
    document.body.appendChild(el);}
  el.textContent+=(e.message+'\n'+((e.error&&e.error.stack)||'')+'\n\n');
});
/* ================================================================
   飞天 · 散花梦 —— 单文件敦煌飞天 2D 游戏
   绘制全部程序化：Verlet 丝带 / 分层视差 / 粒子池 / WebAudio 五声
   ================================================================ */

/* ---------- 色板 tokens（画布侧） ---------- */
const T = {
  ink:'#120d17',
  skyTop:'#0a0e19', skyHi:'#101828', skyMid:'#1d2130', skyLow:'#3a2a2b', skyHor:'#5e3520',
  ivory:'#e9dfc8', ivoryDim:'#cfc4ab',
  gold:'#d9a441', goldBright:'#f2c968', goldPale:'#f7e3ad',
  cinnabar:'#c0402c', cinnabarDeep:'#8a2a1e',
  azurite:'#4a7ba6', malachite:'#5e8c6a',
  duneFar:'#191420', duneNear:'#0d0a12',
  skin:'#ecd9bd', skinShade:'#d5b48c',
  hair:'#1b1416'
};

/* ---------- 基础工具 ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;
function noise1(t,s){ return Math.sin(t*1.7+s)*.5+Math.sin(t*.9+s*2.1)*.35+Math.sin(t*2.9+s*4.2)*.15; }
function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

/* ---------- 画布 ---------- */
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1,S=2,playerX=0,playTop=0,playBot=0;
let skyGrad=null,vigCanvas=null;
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=W<600?1.35:W<1000?1.7:2.05;
  S=Math.min(S,H/430);
  playerX=Math.max(96,Math.min(W*0.30,400));
  playTop=64;playBot=H-84;
  skyGrad=ctx.createLinearGradient(0,0,0,H);
  skyGrad.addColorStop(0,T.skyTop);skyGrad.addColorStop(.45,T.skyHi);
  skyGrad.addColorStop(.72,T.skyMid);skyGrad.addColorStop(.86,T.skyLow);
  skyGrad.addColorStop(1,T.skyHor);
  buildVignette();
  if(typeof spr!=='undefined'&&spr.moon)spr.moon=moonSprite(Math.min(W,H)*.11);
  stars.length=0;seedStars();
}
window.addEventListener('resize',()=>{resize();if(spr&&spr.pagoda)buildDunes();});

/* ---------- 预渲染精灵 ---------- */
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function glowSprite(size,color,inner){
  const c=makeCanvas(size,size),g=c.getContext('2d'),r=size/2;
  const gr=g.createRadialGradient(r,r,0,r,r,r);
  gr.addColorStop(0,hexA(color,inner));gr.addColorStop(.4,hexA(color,inner*.45));gr.addColorStop(1,hexA(color,0));
  g.fillStyle=gr;g.fillRect(0,0,size,size);return c;
}
/* 花瓣精灵 */
function petalSprite(w,h,col,colTip){
  const c=makeCanvas(w,h),g=c.getContext('2d');
  g.translate(w/2,h/2);
  const gr=g.createLinearGradient(0,-h/2,0,h/2);
  gr.addColorStop(0,colTip);gr.addColorStop(1,col);
  g.fillStyle=gr;
  g.beginPath();
  g.moveTo(0,-h*.46);
  g.bezierCurveTo(w*.42,-h*.3,w*.36,h*.28,0,h*.46);
  g.bezierCurveTo(-w*.36,h*.28,-w*.42,-h*.3,0,-h*.46);
  g.closePath();g.fill();
  g.strokeStyle='rgba(20,12,10,.25)';g.lineWidth=.8;g.stroke();
  return c;
}
/* 墨渍精灵 */
function splatSprite(seed){
  const c=makeCanvas(180,180),g=c.getContext('2d');
  let sr=seed;
  const rnd=()=>{sr=(sr*9301+49297)%233280;return sr/233280;};
  g.translate(90,90);
  for(let i=0;i<9;i++){
    const a=rnd()*TAU,d=rnd()*46,r=10+rnd()*26;
    g.fillStyle='rgba(10,7,12,'+(0.5+rnd()*0.35)+')';
    g.beginPath();g.ellipse(Math.cos(a)*d,Math.sin(a)*d,r,r*(0.5+rnd()*0.5),rnd()*TAU,0,TAU);g.fill();
  }
  for(let i=0;i<7;i++){
    const a=rnd()*TAU;
    g.strokeStyle='rgba(10,7,12,.7)';g.lineWidth=1+rnd()*2;
    g.beginPath();g.moveTo(Math.cos(a)*30,Math.sin(a)*30);
    g.quadraticCurveTo(Math.cos(a)*60+rnd()*20-10,Math.sin(a)*60+rnd()*20-10,Math.cos(a)*(75+rnd()*14),Math.sin(a)*(75+rnd()*14));
    g.stroke();
  }
  return c;
}
/* 印章精灵 */
function sealSprite(ch){
  const c=makeCanvas(120,120),g=c.getContext('2d');
  g.translate(60,60);
  g.fillStyle=T.cinnabar;
  g.beginPath();
  const r=52;
  if(g.roundRect){g.roundRect(-r,-r,r*2,r*2,10);}else{g.rect(-r,-r,r*2,r*2);}
  g.fill();
  for(let i=0;i<5;i++){
    g.fillStyle='rgba(138,42,30,.5)';
    g.beginPath();g.ellipse(rand(-45,45),rand(-45,45),rand(4,12),rand(3,9),rand(0,TAU),0,TAU);g.fill();
  }
  g.strokeStyle='rgba(246,234,214,.9)';g.lineWidth=3;
  g.strokeRect(-42,-42,84,84);
  g.fillStyle='#f6ead6';
  g.font='64px "KaiTi","STKaiti",serif';
  g.textAlign='center';g.textBaseline='middle';
  g.fillText(ch,0,4);
  for(let i=0;i<26;i++){
    g.fillStyle='rgba(18,13,23,'+rand(.05,.16)+')';
    g.fillRect(rand(-48,48),rand(-48,48),rand(1,3),rand(1,3));
  }
  return c;
}
/* 月亮 */
function moonSprite(r){
  const c=makeCanvas(r*4.4,r*4.4),g=c.getContext('2d'),m=c.width/2;
  const halo=g.createRadialGradient(m,m,r*.7,m,m,r*2.1);
  halo.addColorStop(0,'rgba(244,222,170,.30)');halo.addColorStop(.5,'rgba(244,222,170,.10)');halo.addColorStop(1,'rgba(244,222,170,0)');
  g.fillStyle=halo;g.fillRect(0,0,c.width,c.height);
  const disc=g.createRadialGradient(m-r*.3,m-r*.3,r*.2,m,m,r);
  disc.addColorStop(0,'#f9ecc9');disc.addColorStop(.8,'#f0dca6');disc.addColorStop(1,'#dcbe82');
  g.fillStyle=disc;g.beginPath();g.arc(m,m,r,0,TAU);g.fill();
  for(let i=0;i<10;i++){

/* ---------- 音频（全程序化） ---------- */
const AudioBus={
  ctx:null,master:null,muted:false,started:false,
  start(){
    if(this.started)return;this.started=true;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=this.muted?0:0.8;
      this.master.connect(this.ctx.destination);
      this.ambient();
    }catch(e){}
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume(); },
  setMuted(m){ this.muted=m; if(this.master)this.master.gain.value=m?0:0.8; },
  ambient(){
    const c=this.ctx;
    const mk=(f,type,g,lfoF,lfoG)=>{
      const o=c.createOscillator(),gn=c.createGain();
      o.type=type;o.frequency.value=f;gn.gain.value=g;
      const lfo=c.createOscillator(),lg=c.createGain();
      lfo.frequency.value=lfoF;lg.gain.value=lfoG*lfoF*0+g*0.3;
      lfo.connect(lg);lg.connect(gn.gain);
      o.connect(gn);gn.connect(this.master);
      o.start();lfo.start();
    };
    mk(73.42,'sine',.045,.13);mk(110,'sine',.032,.17);mk(146.83,'sine',.014,.23);
    const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=c.createBufferSource();src.buffer=buf;src.loop=true;
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=.5;
    const g=c.createGain();g.gain.value=.014;
    src.connect(bp);bp.connect(g);g.connect(this.master);src.start();
  },
  env(g,t0,peak,dur){
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(peak,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  },
  pluck(freq,vol){
    if(!this.ctx)return;const c=this.ctx,t=c.currentTime;
    const o=c.createOscillator(),g=c.createGain();
    o.type='triangle';o.frequency.value=freq;
    this.env(g,t,vol||.16,.55);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.6);
    const o2=c.createOscillator(),g2=c.createGain();
    o2.type='sine';o2.frequency.value=freq/2;
    this.env(g2,t,(vol||.16)*.4,.4);
    o2.connect(g2);g2.connect(this.master);o2.start(t);o2.stop(t+.45);
  },
  bell(freq){
    if(!this.ctx)return;const c=this.ctx,t=c.currentTime;
    [[1,.10],[2.7,.03],[4.1,.014]].forEach(p=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.frequency.value=freq*p[0];
      this.env(g,t,p[1],2.2);
      o.connect(g);g.connect(this.master);o.start(t);o.stop(t+2.3);
    });
  },
  thud(){
    if(!this.ctx)return;const c=this.ctx,t=c.currentTime;
    const o=c.createOscillator(),g=c.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.24);
    this.env(g,t,.5,.3);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.32);
    const len=c.sampleRate*.18,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    const s=c.createBufferSource();s.buffer=buf;
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=600;
    const g2=c.createGain();g2.gain.value=.3;
    s.connect(f);f.connect(g2);g2.connect(this.master);s.start(t);
  },
  gong(){
    if(!this.ctx)return;const c=this.ctx,t=c.currentTime;
    [[98,.34],[147,.2],[198,.13],[269,.09],[369,.06]].forEach((p,i)=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.frequency.value=p[0];
      this.env(g,t+i*.012,p[1],4.2);
      o.connect(g);g.connect(this.master);o.start(t);o.stop(t+4.4);
    });
    const len=c.sampleRate*.9,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const s=c.createBufferSource();s.buffer=buf;
    const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=3200;
    const g=c.createGain();g.gain.value=.05;
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t);
  },
  heartLose(){
    if(!this.ctx)return;
    this.pluck(311,.12);const c=this.ctx;
    setTimeout(()=>this.pluck(233,.12),130);
  }
};

/* ---------- 丝带（Verlet） ---------- */
class Ribbon{
  constructor(n,seg,color,wmax,anchor){
    this.n=n;this.segBase=seg;this.wBase=wmax;this.color=color;this.anchor=anchor;
    this.seg=seg;this.wmax=wmax;
    this.pts=[];this.init(0,0);
  }
  init(x,y){
    this.seg=this.segBase*S;this.wmax=this.wBase*S;
    this.pts.length=0;
    for(let i=0;i<this.n;i++)this.pts.push({x:x-i*this.seg,y:y+i*this.seg*.06,px:x-i*this.seg,py:y+i*this.seg*.06});
  }
  update(dt,ax,ay,windX,windY){
    const damp=0.962,pts=this.pts;
    pts[0].x=ax;pts[0].y=ay;pts[0].px=ax;pts[0].py=ay;
    const dd=Math.min(dt,1/30);
    for(let i=1;i<this.n;i++){
      const p=pts[i];
      const vx=(p.x-p.px)*damp,vy=(p.y-p.py)*damp;
      p.px=p.x;p.py=p.y;
      p.x+=vx+windX*dd*dd*(1+i/this.n);
      p.y+=vy+windY*dd*dd*(1+i/this.n);
    }
    for(let k=0;k<2;k++){
      for(let i=1;i<this.n;i++){
        const a=pts[i-1],b=pts[i];
        let dx=b.x-a.x,dy=b.y-a.y;
        const d=Math.sqrt(dx*dx+dy*dy)||1;
        const diff=(d-this.seg)/d;
        b.x-=dx*diff;b.y-=dy*diff;
      }
      pts[0].x=ax;pts[0].y=ay;
    }
  }
  draw(g){
    const pts=this.pts,n=this.n;
    const head=pts[0],tail=pts[n-1];
    const gr=g.createLinearGradient(head.x,head.y,tail.x,tail.y);
    gr.addColorStop(0,hexA(this.color,.88));
    gr.addColorStop(.55,hexA(this.color,.5));
    gr.addColorStop(1,hexA(this.color,.04));
    g.fillStyle=gr;g.beginPath();
    const L=[],R=[];
    for(let i=0;i<n;i++){
      const p=pts[i];
      const p0=pts[Math.max(i-1,0)],p1=pts[Math.min(i+1,n-1)];
      let dx=p1.x-p0.x,dy=p1.y-p0.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;dx/=d;dy/=d;
      const t=i/(n-1);
      const w=this.wmax*(0.18+0.82*Math.sin(Math.PI*Math.pow(t,0.72)));
      L.push(p.x-dy*w,p.y+dx*w);R.push(p.x+dy*w,p.y-dx*w);
    }
    g.moveTo(L[0],L[1]);
    for(let i=1;i<n;i++)g.lineTo(L[i*2],L[i*2+1]);
    for(let i=n-1;i>=0;i--)g.lineTo(R[i*2],R[i*2+1]);
    g.closePath();g.fill();
    /* 柔光 */
    g.save();g.globalCompositeOperation='lighter';
    g.strokeStyle=hexA(this.color,.10);g.lineWidth=this.wmax*2.1;g.lineCap='round';g.lineJoin='round';
    g.beginPath();g.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<n;i++)g.lineTo(pts[i].x,pts[i].y);
    g.stroke();g.restore();
  }
}

const Player={
  x:0,y:0,ty:0,vy:0,bank:0,phase:0,sway:0,invuln:0,bloom:0,alpha:1,dissolving:0,
  ribbons:[],
  init(){
    this.ribbons=[
      new Ribbon(26,6.8,T.gold,6.5,{ox:48,oy:-20,layer:1}),
      new Ribbon(24,6.2,T.cinnabar,6,{ox:-36,oy:4,layer:1}),
      new Ribbon(20,5.6,T.azurite,5.5,{ox:8,oy:-8,layer:0}),
      new Ribbon(19,5.4,T.malachite,5,{ox:-10,oy:22,layer:0}),
      new Ribbon(18,5.2,T.ivory,4.5,{ox:-4,oy:-6,layer:0})
    ];
  },
  reset(){
    this.x=Game.state==='title'?W*0.62:playerX;
    this.y=H*.46;this.ty=this.y;this.vy=0;this.bank=0;
    this.invuln=0;this.bloom=0;this.dissolving=0;
    this.ribbons.forEach(r=>r.init(this.x,this.y));
  },
  update(dt){
    if(this.dissolving>0){this.dissolving+=dt;return;}
    this.ty=Input.targetY(dt);
    const prevY=this.y;
    this.y+=(this.ty-this.y)*Math.min(1,9.5*dt);
    this.vy=(this.y-prevY)/Math.max(dt,.001);
    const targetBank=clamp(this.vy*0.0011,-.4,.4);
    this.bank+=(targetBank-this.bank)*Math.min(1,6*dt);
    this.phase+=dt*(1.4+Math.abs(this.vy)*0.002);
    if(this.invuln>0)this.invuln-=dt;
    if(this.bloom>0)this.bloom=Math.max(0,this.bloom-dt*.9);
    const tilt=-.10+this.bank+Math.sin(this.phase)*.045;
    const s=S;
    const cs=Math.cos(tilt),sn=Math.sin(tilt);
    const wb=this.bloom;
    const windX=-(Game.speed*0.9+120)*(1+wb*.6)*(RM?0.7:1);
    const windY=-8+noise1(Game.time*0.9,9)*20;
    for(const r of this.ribbons){
      const a=r.anchor;
      const ax=this.x+(a.ox*cs-a.oy*sn)*s;
      const ay=this.y+(a.ox*sn+a.oy*cs)*s;
      r.seg=r.segBase*s;
      r.wmax=r.wBase*s*(1+wb*.45);
      r.update(dt,ax,ay,windX,windY+noise1(Game.time*1.1,a.ox)*18);
    }
  },
  anchorsWorld(){
    const tilt=-.10+this.bank+Math.sin(this.phase)*.045;
    const cs=Math.cos(tilt),sn=Math.sin(tilt),s=S;
    return this.ribbons.map(r=>{
      const a=r.anchor;
      return {r,ax:this.x+(a.ox*cs-a.oy*sn)*s,ay:this.y+(a.ox*sn+a.oy*cs)*s};
    });
  },
  draw(g){
    if(this.dissolving>1.3)return;
    const s=S,t=this.phase;
    const alpha=this.dissolving>0?Math.max(0,1-this.dissolving/1.2):(this.invuln>0?(.45+.3*Math.sin(Game.time*40)):1);
    const wb=this.bloom;
    const A=this.anchorsWorld();
    g.save();
    g.globalAlpha=alpha;
    /* 远层丝带（世界坐标） */
    for(const i of [2,3,4])this.ribbons[i].draw(g);
    /* 身形（图元坐标） */
    g.translate(this.x,this.y);
    g.rotate(-.10+this.bank+Math.sin(t)*.045);
    g.scale(s,s);
    /* 全身背光 */
    g.save();g.globalAlpha=alpha*.6;
    g.strokeStyle=hexA(T.gold,.30);g.lineWidth=1;
    g.beginPath();g.ellipse(-4,10,92+wb*30,52+wb*18,-.15,0,TAU);g.stroke();
    const mg=g.createRadialGradient(-4,10,4,-4,10,92);
    mg.addColorStop(0,hexA(T.goldBright,.09+wb*.06));mg.addColorStop(1,hexA(T.goldBright,0));
    g.fillStyle=mg;g.beginPath();g.ellipse(-4,10,92+wb*30,52+wb*18,-.15,0,TAU);g.fill();
    g.restore();
    /* 头光 */
    drawHalo(g,34,-16,t,wb,alpha);
    /* 后臂 / 后腿 */
    limb(g,[[-2,-6],[-14,-4],[-26,0],[-36,4]],5.5,1.8,T.skinShade);
    limb(g,[[-14,28],[-34,44],[-54,36],[-62,32]],7.5,2,T.skinShade);
    /* 裙（石绿衬层 + 朱砂主层） */
    skirt(g,alpha,wb);
    limb(g,[[-24,32],[-40,38],[-58,46],[-74,56]],4.5,.8,hexA(T.ivory,.55));
    /* 躯干 */
    limb(g,[[10,-6],[2,0],[-6,8],[-12,20]],12,9,T.skin);
    limb(g,[[11,-7],[4,-2],[-3,6]],11,10,T.cinnabar);
    g.strokeStyle=hexA(T.gold,.7);g.lineWidth=1;
    g.beginPath();g.moveTo(12,-8);g.quadraticCurveTo(4,-3,-4,7);g.stroke();
    /* 金腰线 */

    g.beginPath();g.moveTo(-6,10);g.quadraticCurveTo(-10,16,-13,22);g.stroke();
    /* 前腿 */
    limb(g,[[-12,26],[-30,40],[-50,30],[-58,24]],8,2,T.skin);
    g.fillStyle=T.gold;g.beginPath();g.ellipse(-59,24,3.2,1.8,-.5,0,TAU);g.fill();
    /* 颈 + 头 */

    /* 前臂 + 手中莲 */

    drawLotus(g,52,-24,.9,t);
    g.restore();
    /* 近层丝带（世界坐标） */
    g.save();
    g.globalAlpha=alpha;
    for(const i of [0,1])this.ribbons[i].draw(g);
    g.restore();
  }
};
function limb(g,pts,w0,w1,color){
  if(pts.length<2)return;
  const L=[],R=[];
  for(let i=0;i<pts.length;i++){
    const p0=pts[Math.max(i-1,0)],p1=pts[Math.min(i+1,pts.length-1)];
    let dx=p1[0]-p0[0],dy=p1[1]-p0[1];
    const d=Math.sqrt(dx*dx+dy*dy)||1;dx/=d;dy/=d;
    const w=lerp(w0,w1,i/(pts.length-1))/2;
    L.push(pts[i][0]-dy*w,pts[i][1]+dx*w);
    R.push(pts[i][0]+dy*w,pts[i][1]-dx*w);
  }
  g.fillStyle=color;g.beginPath();
  g.moveTo(L[0],L[1]);
  for(let i=1;i<pts.length;i++)g.lineTo(L[i*2],L[i*2+1]);
  for(let i=pts.length-1;i>=0;i--)g.lineTo(R[i*2],R[i*2+1]);
  g.closePath();g.fill();
}
function qpts(p0,p1,p2,n){
  const out=[];
  for(let i=0;i<=n;i++){
    const t=i/n,a=(1-t)*(1-t),b=2*(1-t)*t,c=t*t;
    out.push([a*p0[0]+b*p1[0]+c*p2[0],a*p0[1]+b*p1[1]+c*p2[1]]);
  }
  return out;
}

function drawBlade(g,b,t){

  const active=b.t-b.tele;
  g.save();g.translate(b.x,b.y);g.rotate(Math.PI);
  for(let i=2;i>=0;i--){
    g.save();g.translate(i*16,0);
    g.globalAlpha=i===0?1:.14*(3-i);
    const bg=g.createLinearGradient(0,-16,0,16);
    bg.addColorStop(0,'#e8cf9e');bg.addColorStop(1,'#c8a76a');
    g.fillStyle=bg;
    g.beginPath();
    g.arc(0,0,15,-.6,.6);
    g.arc(-6,0,11,.55,-.55,true);
    g.closePath();g.fill();
    g.strokeStyle=T.cinnabar;g.lineWidth=1.1;g.stroke();
    g.restore();
  }
  g.restore();
  g.save();g.globalCompositeOperation='lighter';
  g.strokeStyle=hexA(T.ivory,.2);g.lineWidth=8;
  g.beginPath();g.moveTo(b.x+8,b.y);g.lineTo(b.x+54,b.y);g.stroke();
  g.restore();
}
function drawBanner(g,b,t){
  const kIn=Math.min(1,b.t*1.2),kOut=Math.min(1,(b.life-b.t)*1.2);
  const a=Math.min(kIn,kOut)*.9;
  g.save();g.globalAlpha=a;g.translate(b.x,b.y);
  g.strokeStyle=hexA(T.gold,.55);g.lineWidth=1;
  g.beginPath();g.moveTo(0,-84);g.lineTo(0,84);g.stroke();
  g.font='26px "KaiTi","STKaiti",serif';
  g.textAlign='center';g.textBaseline='middle';
  g.fillStyle=T.ivory;
  for(let i=0;i<b.chars.length;i++){
    g.fillText(b.chars[i],-14,-60+i*30);
  }
  g.fillStyle=T.cinnabar;
  g.beginPath();g.arc(-14,64,4,0,TAU);g.fill();
  g.restore();
}

/* ---------- 导演（出怪） ---------- */
const Director={
  timer:2,bannerIdx:0,bannerDist:0,
  reset(){this.timer=2.2;this.bannerIdx=0;this.bannerDist=0;lamps.length=0;bells.length=0;wisps.length=0;blades.length=0;banners.length=0;},
  update(dt){
    const d=Game.diff;
    if(Game.state!=='play'&&Game.state!=='title')return;
    if(Game.state==='title'){
      this.timer-=dt;
      if(this.timer<=0){
        this.timer=rand(1.1,1.8);
        const y=rand(playTop+40,playBot-40);
        spawnLamp(W+60,y);
        if(Math.random()<.35)spawnLamp(W+130,clamp(y+rand(-90,90),playTop+30,playBot-30));
      }
      return;
    }
    this.timer-=dt;
    if(this.timer<=0){
      this.timer=lerp(1.15,.72,d)*rand(.85,1.2);
      const roll=Math.random();
      const mid=rand(playTop+90,playBot-90);
      if(roll<.30){
        const n=5+Math.floor(rand(0,3));
        for(let i=0;i<n;i++){

          spawnLamp(W+60+i*76,clamp(mid+Math.sin(t*Math.PI)*rand(-110,110),playTop+30,playBot-30));
        }

        const n=6+Math.floor(d*3);
        for(let i=0;i<n;i++)

      }else if(roll<.66&&d>.12){
        const n=1+Math.floor(rand(0,1.6)+d);
        for(let i=0;i<n;i++)spawnWisp(W+60+i*150,rand(playTop+60,playBot-60));
      }else if(roll<.80&&d>.2){
        const n=1+Math.floor(d*2.2);
        for(let i=0;i<n;i++)spawnBlade(W+40+i*40,rand(playTop+50,playBot-50));
      }else if(roll<.88){
        spawnBell(W+70,rand(playTop+70,playBot-70));
        for(let i=0;i<3;i++)spawnLamp(W+150+i*70,clamp(mid+rand(-80,80),playTop+30,playBot-30));
      }else{
        spawnLamp(W+60,mid);
        spawnLamp(W+150,clamp(mid+70,playTop+30,playBot-30));
      }
    }
    const li=Game.li;
    if(li>=this.bannerDist+60){
      this.bannerDist=li;
      spawnBanner(MILESTONES[this.bannerIdx%MILESTONES.length]);
      this.bannerIdx++;

/* ---------- 游戏主控 ---------- */
const RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const Game={
  state:'title',paused:false,time:0,runTime:0,
  speed:160,targetSpeed:160,worldX:0,
  score:0,combo:0,comboTimer:0,maxCombo:0,lampCount:0,hearts:3,
  meter:0,meterMax:10,ultActive:0,ultLock:false,
  distPx:0,diff:0,li:0,best:0,
  shake:0,flash:0,hitVig:0,timeScale:1,tsTarget:1,
  shotMode:null,
  reset(){
    this.runTime=0;this.score=0;this.combo=0;this.comboTimer=0;this.maxCombo=0;
    this.lampCount=0;this.hearts=3;this.meter=0;this.ultActive=0;this.ultLock=false;
    this.distPx=0;this.diff=0;this.li=0;this.speed=240;this.targetSpeed=240;
    this.shake=0;this.flash=0;this.hitVig=0;this.timeScale=1;this.tsTarget=1;
    Player.reset();Director.reset();
    Petals.pool.length=0;Sparks.pool.length=0;Rings.pool.length=0;Glyphs.pool.length=0;Splats.pool.length=0;Stamps.pool.length=0;
    this.stampFlags={miao:false,jue:false,shen:false};
    canvas.style.filter='';
  },
  start(){
    if(this.state==='play')return;
    this.state='play';
    this.reset();

    UI.showHUD();UI.hideTitle();UI.hideEnd();UI.updateHearts(this.hearts);
    AudioBus.start();AudioBus.resume();
    UI.spaceHint(true);
    setTimeout(()=>UI.spaceHint(false),6000);
  },
  actionSpace(){
    if(this.state==='title'){this.start();return;}
    if(this.state==='play'&&!this.paused)this.ultimate();
  },
  ultimate(){
    if(this.meter<this.meterMax||this.ultLock||Player.dissolving>0)return;
    this.ultLock=true;
    this.ultActive=1.7;
    this.tsTarget=RM?0.55:0.3;
    this.flash=RM?.25:.55;
    this.shake=Math.max(this.shake,RM?0:10);
    Stamps.spawn(spr.sealSan,true);
    Rings.spawn(Player.x,Player.y,Math.max(W,H)*.7,'#f2c968',26);
    Rings.spawn(Player.x,Player.y,Math.max(W,H)*.5,'#fff2cf',12);
    AudioBus.gong();
    Player.bloom=1;
    canvas.style.filter='saturate(1.35) contrast(1.06)';
    setTimeout(()=>{canvas.style.filter='';},900);
  },
  addScore(base){
    const mult=1+Math.min(this.combo,24)*0.15;
    const pts=Math.round(base*mult/5)*5;
    this.score+=pts;
    return pts;
  },
  onCollect(x,y,isBell){
    this.combo++;this.comboTimer=4;
    this.maxCombo=Math.max(this.maxCombo,this.combo);
    const pts=this.addScore(isBell?400:100);
    Glyphs.spawn(x,y-26,'+'+pts,isBell?26:22,isBell?T.ivory:T.goldPale);
    if(isBell){
      Glyphs.spawn(x,y-52,'心灯·明',17,T.ivory);
      if(this.hearts<3){this.hearts++;UI.updateHearts(this.hearts);}
      this.meter=Math.min(this.meterMax,this.meter+2);
      AudioBus.bell(1046);
    }else{
      this.lampCount++;
      this.meter=Math.min(this.meterMax,this.meter+1);
      const idx=Math.min(this.combo,14);
      AudioBus.pluck(PENTA[idx],.15);
    }
    if(this.combo===8&&!this.stampFlags.miao){this.stampFlags.miao=true;Stamps.spawn(spr.sealMiao);AudioBus.gong();}
    if(this.combo===16&&!this.stampFlags.jue){this.stampFlags.jue=true;Stamps.spawn(spr.sealJue);AudioBus.gong();}
    if(this.combo===26&&!this.stampFlags.shen){this.stampFlags.shen=true;Stamps.spawn(spr.sealShen);AudioBus.gong();}
    UI.setCombo(this.combo);UI.setScore(this.score);
  },
  onHit(x,y){
    if(Player.invuln>0||Player.dissolving>0)return;
    this.hearts--;
    this.combo=0;this.comboTimer=0;
    UI.setCombo(0);UI.updateHearts(this.hearts);
    Player.invuln=1.6;
    this.shake=Math.max(this.shake,RM?0:14);
    this.hitVig=1;
    Splats.spawn(x,y);
    Sparks.spawn(x,y,10,'#a03024');
    AudioBus.thud();AudioBus.heartLose();
    canvas.style.filter='saturate(.7)';
    setTimeout(()=>{if(this.state==='play')canvas.style.filter='';},320);
    if(this.hearts<=0)this.die();
  },
  die(){
    this.state='end';
    Player.dissolving=.001;
    this.targetSpeed=50;
    for(let i=0;i<80;i++){
      const a=rand(0,TAU),v=rand(40,300);
      Petals.spawn(Player.x+rand(-20,20),Player.y+rand(-30,30),
        Math.cos(a)*v,Math.sin(a)*v-60,
        [spr.petalIvory,spr.petalGold,spr.petalCinnabar][Math.floor(rand(0,3))],
        rand(.5,1.1),rand(1.2,2.6),false);
    }
    AudioBus.heartLose();AudioBus.gong();
    const isRecord=this.score>this.best&&this.score>0;
    if(isRecord){this.best=this.score;try{localStorage.setItem('feitian_best',String(this.best));}catch(e){}}
    setTimeout(()=>{UI.showEnd(this,isRecord);},1500);
  },
  update(dt){
    this.time+=dt;
    if(this.paused)return;
    const rdt=dt;
    this.timeScale+=(this.tsTarget-this.timeScale)*Math.min(1,6*rdt);
    if(this.ultActive>0){
      this.ultActive-=rdt;
      if(this.ultActive<=0){this.tsTarget=1;}
    }
    const wdt=dt*this.timeScale;
    this.runTime+=wdt;
    /* 速度 */
    if(this.state==='play'){
      this.diff=clamp((this.li-6)/160,0,1);
      this.targetSpeed=240+180*this.diff;
    }else if(this.state==='title'){this.targetSpeed=170;}
    this.speed+=(this.targetSpeed-this.speed)*Math.min(1,1.2*rdt);
    this.worldX+=this.speed*wdt;
    this.distPx+=this.speed*wdt;
    this.li=Math.floor(this.distPx/60);
    if(this.state==='play'){
      UI.setDist(this.li);
      if(this.comboTimer>0){this.comboTimer-=wdt;if(this.comboTimer<=0){this.combo=0;UI.setCombo(0);}}
      if(this.ultLock&&this.ultActive<=0){
        this.meter=Math.max(0,this.meter-wdt*(this.meterMax/1.7));
        if(this.meter<=0){this.ultLock=false;UI.setMeter(this.meter/this.meterMax,false);}
      }
      UI.setMeter(this.meter/this.meterMax,this.meter>=this.meterMax&&!this.ultLock);
    }
    Director.update(wdt);
    /* 终式花瓣 */
    if(this.ultActive>0){
      const rate=this.ultActive>0.4?10:0;
      for(let i=0;i<rate;i++){
        if(Math.random()<(RM?.5:1))Petals.spawn(
          Player.x+rand(-30,30),Player.y+rand(-30,30),
          rand(-380,380),rand(-380,200),
          [spr.petalIvory,spr.petalGold,spr.petalCinnabar,spr.petalMalachite][Math.floor(rand(0,4))],
          rand(.6,1.3),rand(.9,1.8),true);
      }
      if(this.ultActive>1.0){
        for(const w of wisps){
          if(!w.dead){w.dead=true;this.score+=150;UI.setScore(this.score);Glyphs.spawn(w.x,w.y,'+150',20,T.goldPale);
            Splats.spawn(w.x,w.y);Sparks.spawn(w.x,w.y,8,T.gold);
            for(let i=0;i<6;i++)Petals.spawn(w.x,w.y,rand(-200,200),rand(-200,120),spr.petalCinnabar,rand(.5,1),rand(.8,1.6),false);}
        }
        for(const b of blades){
          if(!b.dead&&b.t>=b.tele){b.dead=true;this.score+=100;UI.setScore(this.score);
            Sparks.spawn(b.x,b.y,6,T.ivory);
            for(let i=0;i<4;i++)Petals.spawn(b.x,b.y,rand(-160,160),rand(-160,80),spr.petalGold,rand(.4,.9),rand(.7,1.4),false);}
        }
      }
    }
    /* 实体运动 */
    const mv=this.speed*wdt;
    for(let i=lamps.length-1;i>=0;i--){
      const l=lamps[i];l.t+=wdt;l.x-=mv;
      if(this.ultActive<=0&&this.state==='play'&&this.meter>=this.meterMax){
        const dx=Player.x-l.x,dy=Player.y-l.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<300){l.x+=dx/d*260*wdt;l.y+=dy/d*260*wdt;}
      }
      if(l.x<-80)lamps.splice(i,1);
    }
    for(let i=bells.length-1;i>=0;i--){
      const b=bells[i];b.t+=wdt;b.x-=mv;
      if(b.x<-80)bells.splice(i,1);
    }
    for(let i=wisps.length-1;i>=0;i--){
      const w=wisps[i];w.t+=wdt;w.x-=mv*.94;
      w.y=w.baseY+Math.sin(w.t*1.3+w.ph)*24;
      for(const pts of w.tendrils){
        pts[0].x=w.x-Math.cos(w.ph)*6;pts[0].y=w.y;
        const dd=Math.min(wdt,1/30);
        for(let k=1;k<pts.length;k++){
          const p=pts[k];
          const vx=(p.x-p.px)*.94,vy=(p.y-p.py)*.94;
          p.px=p.x;p.py=p.y;
          p.x+=vx-this.speed*0.9*dd;
          p.y+=vy+Math.sin(this.time*2+k*.6+w.ph)*dd*46;
        }
        for(let it=0;it<2;it++)for(let k=1;k<pts.length;k++){
          const a=pts[k-1],b2=pts[k];
          let dx=b2.x-a.x,dy=b2.y-a.y;
          const dl=Math.sqrt(dx*dx+dy*dy)||1;
          const diff=(dl-5)/dl;
          b2.x-=dx*diff;b2.y-=dy*diff;
        }
      }
      if(w.x<-100||w.dead)wisps.splice(i,1);
    }
    for(let i=blades.length-1;i>=0;i--){
      const b=blades[i];b.t+=wdt;
      if(b.t>=b.tele){
        b.x-=(this.speed*1.9+140)*wdt;
        if(!b.missed&&Math.abs(b.y-Player.y)<46&&b.x<Player.x-30){b.missed=true;this.score+=15;UI.setScore(this.score);Glyphs.spawn(Player.x+30,Player.y-30,'险·15',16,T.ivory);}
        if(b.x<-80||b.dead)blades.splice(i,1);
      }
    }
    for(let i=banners.length-1;i>=0;i--){
      const b=banners[i];b.t+=wdt;b.x-=mv*.85;
      if(b.t>b.life||b.x<-140)banners.splice(i,1);
    }
    /* 碰撞 */
    if(this.state==='play'&&Player.dissolving<=0){
      const pr=20*S*.62;
      for(let i=lamps.length-1;i>=0;i--){
        const l=lamps[i];
        const ly=l.y+lampBob(l);
        const dx=l.x-Player.x,dy=ly-Player.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<pr+30){
          this.onCollect(l.x,ly,false);
          Rings.spawn(l.x,ly,64,T.goldBright,8);
          Sparks.spawn(l.x,ly,7,T.goldBright);
          for(let k=0;k<5;k++)Petals.spawn(l.x,l.y,rand(-140,140),rand(-160,40),spr.petalIvory,rand(.4,.8),rand(.6,1.2),false);
          lamps.splice(i,1);
        }
      }
      for(let i=bells.length-1;i>=0;i--){
        const b=bells[i];
        const dx=b.x-Player.x,dy=b.y-Player.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<pr+34){
          this.onCollect(b.x,b.y,true);
          Rings.spawn(b.x,b.y,80,T.ivory,8);
          Sparks.spawn(b.x,b.y,10,T.goldBright);
          bells.splice(i,1);
        }
      }
      for(const w of wisps){
        if(w.dead)continue;
        const dx=w.x-Player.x,dy=w.y-Player.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<pr+26)this.onHit(w.x,w.y);
      }
      for(const b of blades){
        if(b.t<b.tele||b.dead)continue;
        const dx=b.x-Player.x,dy=b.y-Player.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<pr+16)this.onHit(b.x,b.y);
      }
    }
    /* 险情近擦 */
    if(this.shotMode&&this.meter>=this.meterMax&&!this.ultLock)this.ultimate();
    Player.update(wdt);
    if(this.ultActive>0)Player.bloom=1;
    Petals.update(wdt,Player.x,Player.y);
    Sparks.update(wdt);Rings.update(rdt);Glyphs.update(rdt);Splats.update(wdt);Stamps.update(rdt);
    Dust.update(wdt,this.speed);
    /* 环境花瓣 */
    if(Math.random()<(RM?.1:.2)){
      Petals.spawn(W+rand(10,140),rand(-20,H*.4),-Game.speed*rand(.55,.95),rand(14,44),
        [spr.petalIvory,spr.petalGold][Math.floor(rand(0,2))],rand(.35,.7),rand(4,7),false);
    }
    this.shake*=Math.pow(.0018,rdt);
    this.flash*=Math.pow(.006,rdt);
    this.hitVig*=Math.pow(.05,rdt);
  }
};
const PENTA=[262,294,330,392,440,523,587,659,784,880,1046,1174,1318,1568,1760];

/* ---------- 渲染 ---------- */
let shootingStar=null,shootTimer=rand(8,18);
function render(){
  const t=Game.time;
  ctx.clearRect(0,0,W,H);
  /* 天空 */
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,W,H);
  const hor=ctx.createRadialGradient(W*.7,H*.98,0,W*.7,H*.98,W*.55);
  hor.addColorStop(0,'rgba(150,74,32,.30)');hor.addColorStop(1,'rgba(150,74,32,0)');
  ctx.fillStyle=hor;ctx.fillRect(0,H*.4,W,H*.6);
  ctx.save();
  const shx=(Math.random()*2-1)*Game.shake,shy=(Math.random()*2-1)*Game.shake;
  ctx.translate(shx,shy);
  /* 星 */
  for(const st of stars){
    const a=.3+.5*Math.sin(t*st.sp+st.ph);
    ctx.fillStyle='rgba(244,232,205,'+(a*.8)+')';
    ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,TAU);ctx.fill();
    if(st.big&&a>.6){
      ctx.strokeStyle='rgba(244,232,205,'+(a*.4)+')';ctx.lineWidth=.7;
      ctx.beginPath();ctx.moveTo(st.x-4,st.y);ctx.lineTo(st.x+4,st.y);
      ctx.moveTo(st.x,st.y-4);ctx.lineTo(st.x,st.y+4);ctx.stroke();
    }
  }
  /* 流星 */
  shootTimer-=1/60;
  if(shootTimer<=0&&!shootingStar&&!RM){shootingStar={x:rand(W*.3,W*.9),y:rand(30,H*.3),t:0};shootTimer=rand(12,26);}
  if(shootingStar){
    shootingStar.t+=1/60;
    const k=shootingStar.t/.7;
    if(k>1)shootingStar=null;
    else{
      const x=shootingStar.x-k*260,y=shootingStar.y+k*90;
      const gr=ctx.createLinearGradient(x,y,x+90,y-32);
      gr.addColorStop(0,'rgba(247,227,173,.8)');gr.addColorStop(1,'rgba(247,227,173,0)');
      ctx.strokeStyle=gr;ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+90,y-32);ctx.stroke();
    }
  }
  /* 月 */
  ctx.drawImage(spr.moon,W*.72-spr.moon.width/2,H*.28-spr.moon.height/2);
  /* 藻井 */
  const ms=Math.min(W,H)/620*.9;
  ctx.save();
  ctx.translate(W*.5+noise1(t*.1,4)*20,H*.44);
  ctx.rotate(t*.008);
  ctx.scale(ms,ms);
  ctx.globalAlpha=.055;
  ctx.drawImage(spr.mandala,-310,-310);
  ctx.rotate(Math.PI/6);ctx.scale(.6,.6);
  ctx.globalAlpha=.042;
  ctx.drawImage(spr.mandala,-310,-310);
  ctx.restore();
  /* 远丘 + 近丘（含九层楼剪影循环） */
  const loop=duneFarCanvas.width;
  let ox=-((Game.worldX*0.16)%loop);
  ctx.drawImage(duneFarCanvas,ox,0);ctx.drawImage(duneFarCanvas,ox+loop,0);
  const loop2=duneNearCanvas.width;
  let ox2=-((Game.worldX*0.3)%loop2);
  ctx.drawImage(duneNearCanvas,ox2,0);ctx.drawImage(duneNearCanvas,ox2+loop2,0);
  /* 祥云 */
  for(const c of clouds){
    const span=W+700;
    const cx=((c.x-Game.worldX*0.36)%span+span)%span-350;
    ctx.globalAlpha=c.a;
    ctx.drawImage(c.sp,cx,c.y,c.w,c.h);
  }
  ctx.globalAlpha=1;
  /* 灰尘（后层） */
  Dust.draw(ctx);
  /* 里程竖幅 */
  for(const b of banners)drawBanner(ctx,b,t);
  /* 墨煞 */
  for(const w of wisps)drawWisp(ctx,w,t);
  /* 风刃 */
  for(const b of blades)drawBlade(ctx,b,t);
  /* 莲灯 / 金铃 */
  for(const l of lamps)drawLamp(ctx,l,t);
  for(const b of bells)drawBell(ctx,b,t);
  /* 飞天 */
  Player.draw(ctx);
  /* 花瓣 / 光屑 / 墨渍 / 光环 */
  Petals.draw(ctx);
  Sparks.draw(ctx);
  Splats.draw(ctx);
  Rings.draw(ctx);
  Glyphs.draw(ctx);
  ctx.restore();
  /* 暗角 + 颗粒 */
  ctx.drawImage(vigCanvas,0,0);
  ctx.save();
  ctx.globalAlpha=.5;
  ctx.translate(Math.random()*8,Math.random()*8);
  ctx.fillStyle=grainPattern;
  ctx.fillRect(-8,-8,W+16,H+16);
  ctx.restore();
  /* 受击红晕 */
  if(Game.hitVig>0.02){
    const hv=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.7);
    hv.addColorStop(0,'rgba(138,42,30,0)');hv.addColorStop(1,'rgba(138,42,30,'+(Game.hitVig*.4)+')');
    ctx.fillStyle=hv;ctx.fillRect(0,0,W,H);
  }
  /* 印章 */
  Stamps.draw(ctx);
  /* 闪光 */
  if(Game.flash>0.02){
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,236,190,'+(Game.flash*.6)+')';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}
let grainPattern=null;
const clouds=[];
function seedClouds(){
  clouds.length=0;
  const sps=[spr.cloud1,spr.cloud2,spr.cloud3];
  for(let i=0;i<7;i++){
    clouds.push({x:rand(0,W+700),y:rand(H*.08,H*.6),w:rand(160,320),h:rand(60,120),sp:sps[i%3],a:rand(.4,.85)});
  }
}

/* ---------- UI ---------- */
const UI={
  el:{},
  init(){
    const $=id=>document.getElementById(id);
    this.el={
      title:$('ui-title'),hud:$('ui-hud'),end:$('ui-end'),pause:$('ui-pause'),
      score:$('hud-score'),dist:$('hud-dist'),combo:$('hud-combo'),
      meter:$('hud-meter'),meterFill:$('hud-meter-fill'),meterLabel:$('hud-meter-label'),
      lives:$('hud-lives'),spaceHint:$('space-hint'),
      endScore:$('end-score'),endDist:$('end-dist'),endCombo:$('end-combo'),endLamps:$('end-lamps'),endRecord:$('end-record'),
      titleBest:$('title-best'),
      btnStart:$('btn-start'),btnAgain:$('btn-again'),btnResume:$('btn-resume'),
      btnPause:$('btn-pause'),btnMute:$('btn-mute'),btnSanhua:$('btn-sanhua')
    };
    this.el.btnStart.addEventListener('click',()=>{this.el.btnStart.blur();AudioBus.start();AudioBus.resume();Game.start();});
    this.el.btnAgain.addEventListener('click',()=>{this.el.btnAgain.blur();Game.start();});
    this.el.btnResume.addEventListener('click',()=>{Game.togglePause();});
    this.el.btnPause.addEventListener('click',()=>{Game.togglePause();});
    this.el.btnSanhua.addEventListener('click',()=>{Game.ultimate();});
    this.el.btnMute.addEventListener('click',()=>{this.toggleMute();});
    if(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches){
      document.getElementById('title-hints').innerHTML='拖动 · 引飞天之姿<br>右下 · 散花之式';
    }
    try{
      const m=localStorage.getItem('feitian_mute');
      if(m==='1'){AudioBus.muted=true;this.el.btnMute.classList.add('is-muted');}
      Game.best=parseInt(localStorage.getItem('feitian_best')||'0',10)||0;
      if(Game.best>0){this.el.titleBest.hidden=false;this.el.titleBest.textContent='最高 · '+Game.best;}
    }catch(e){}
    this._score=-1;this._dist=-1;this._combo=-1;this._meter=-1;
  },
  toggleMute(){
    AudioBus.start();
    AudioBus.setMuted(!AudioBus.muted);
    this.el.btnMute.classList.toggle('is-muted',AudioBus.muted);
    try{localStorage.setItem('feitian_mute',AudioBus.muted?'1':'0');}catch(e){}
  },
  showHUD(){this.el.hud.classList.add('is-on');this.el.btnSanhua.classList.add('is-visible');},
  hideTitle(){this.el.title.classList.add('is-hidden');},
  hideEnd(){this.el.end.classList.remove('is-on');},
  showEnd(g,isRecord){
    this.el.endScore.textContent=g.score;
    this.el.endDist.textContent=g.li+' 里';
    this.el.endCombo.textContent='×'+g.maxCombo;
    this.el.endLamps.textContent=g.lampCount+' 盏';
    this.el.endRecord.textContent=isRecord?'新纪录':(g.best>0?'最高 · '+g.best:'');
    this.el.end.classList.add('is-on');
    this.el.hud.classList.remove('is-on');
    this.el.btnSanhua.classList.remove('is-visible');
  },
  spaceHint(on){this.el.spaceHint.classList.toggle('is-on',on);},
  setScore(v){if(v!==this._score){this._score=v;this.el.score.textContent=v;}},
  setDist(v){if(v!==this._dist){this._dist=v;this.el.dist.textContent='最远 · '+v+' 里';}},
  setCombo(v){
    if(v===this._combo)return;this._combo=v;
    const el=this.el.combo;
    if(v>=2){el.textContent='连 ×'+v;el.classList.add('is-on');
    }else el.classList.remove('is-on');
  },
  setMeter(k,full){
    const q=Math.round(k*40)/40;
    if(q!==this._meter){this._meter=q;this.el.meterFill.style.transform='scaleX('+q+')';}
    this.el.meter.classList.toggle('is-full',!!full);
    this.el.meterLabel.textContent=full?'散花·待发':'散花';
    this.el.btnSanhua.setAttribute('aria-disabled',full?'false':'true');
    this.el.btnSanhua.classList.toggle('is-ready',!!full);
  },
  updateHearts(n){
    const svgs=this.el.lives.querySelectorAll('svg');
    svgs.forEach((s,i)=>s.classList.toggle('lost',i>=n));
  }
};

/* ---------- 暂停 ---------- */
Game.togglePause=function(){
  if(this.state!=='play')return;
  this.paused=!this.paused;
  UI.el.pause.classList.toggle('is-on',this.paused);
  if(this.paused){canvas.style.filter='';}
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&Game.state==='play'&&!Game.paused)Game.togglePause();
});

/* ---------- 主循环 ---------- */
let lastT=0,fpsN=0,fpsT=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastT)lastT=ts;
  let dt=(ts-lastT)/1000;
  lastT=ts;
  if(dt>0.1)dt=0.1;
  Game.update(dt);
  render();
  AudioBus.resume();
  fpsN++;fpsT+=dt;
  if(fpsT>=1){
    const el=document.getElementById('fps-probe');
    if(el)el.textContent=Math.round(fpsN/fpsT)+' fps';
    fpsN=0;fpsT=0;
  }
}

/* ---------- 启动 ---------- */
function boot(){
  resize();
  buildGrain();
  buildSprites();
  buildDunes();
  grainPattern=ctx.createPattern(grainTile,'repeat');
  seedClouds();
  Dust.init();
  Player.init();
  Input.init();
  UI.init();
  Player.reset();
  Game.stampFlags={};
  const params=new URLSearchParams(location.search);
  Game.shotMode=params.get('shot');
  if(params.get('debug')){
    const f=document.createElement('div');
    f.id='fps-probe';f.textContent='— fps';
    f.style.cssText='position:fixed;left:8px;bottom:8px;z-index:999;color:#9be;font:12px monospace';
    document.body.appendChild(f);
  }
  if(Game.shotMode){
    Input.auto=true;
    UI.hideTitle();
    UI.showHUD();
    Game.state='play';
    Game.reset();
    Input.auto=true;
    if(Game.shotMode==='sanhua'){
      Game.meter=Game.meterMax;
      setTimeout(()=>Game.ultimate(),1500);
    }
    if(Game.shotMode==='end'){
      spawnBanner(MILESTONES[0]);
      setTimeout(()=>{Game.hearts=1;Game.onHit(Player.x+10,Player.y);},4200);
    }
  }
  requestAnimationFrame(loop);
}
window.addEventListener('load',boot);
})();
</script>
