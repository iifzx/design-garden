<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>02 · Membership — Sixth Floor Apiary member report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  h1{font-size:88px;font-weight:700;letter-spacing:-.02em;line-height:1.06;max-width:1300px;margin-bottom:96px}
  h1 em{font-style:normal;color:var(--ochre)}
  .grid{display:grid;grid-template-columns:7fr 5fr;gap:96px;align-items:start}
  .big{font-family:"IBM Plex Mono",monospace;font-size:300px;font-weight:500;line-height:.85}
  .big small{display:block;font-family:"Archivo",sans-serif;font-size:31px;font-weight:500;margin-top:24px;letter-spacing:0}
  .ctx{border-left:1px solid var(--hairline);padding-left:64px}
  .ctx .row{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--hairline);font-size:25px}
  .ctx .row:last-child{border-bottom:0}
  .ctx .row span{color:var(--ink)}
  .ctx .row b{font-family:"IBM Plex Mono",monospace;font-size:31px;font-weight:500}
  .ctx .row.delta b{color:var(--ink)}
</style>
</head>
<body class="slide">
  <h1>More members than any quarter so far — <em>214</em>, up 27% on Q2.</h1>
  <div class="grid">
    <div class="big">214<small>members on the September list</small></div>
    <div class="ctx">
      <div class="row"><span>Q1 2026</span><b>142</b></div>
      <div class="row"><span>Q2 2026</span><b>168</b></div>
      <div class="row"><span>Q3 2026</span><b>214</b></div>
      <div class="row delta"><span>quarter over quarter</span><b>+46</b></div>
    </div>
  </div>
  <div class="demo-note">demo dataset — illustrative numbers<br>for the example deck, not real records</div>
  <div class="folio">02 / 07</div>
</body>
</html>
