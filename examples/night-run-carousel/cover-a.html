<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面变体 A · 大数字门牌 — 城市夜跑 7 件小事</title>
<style>
  :root{
    --night:#0F1B26; --chalk:#EFF3EA; --vis:#D6F54C; --slate:#33465A;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1440px;overflow:hidden}
  body{
    background:var(--night);color:var(--chalk);position:relative;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    font-weight:400;
  }
  .hook{position:absolute;left:96px;top:132px;font-size:44px;font-weight:700;line-height:1.4}
  .seven{position:absolute;right:72px;top:96px;font-size:420px;font-weight:900;line-height:.8;color:var(--vis);font-variant-numeric:tabular-nums}
  .stack{position:absolute;left:96px;top:480px}
  .stack .l1{font-size:110px;font-weight:900;line-height:1.22;letter-spacing:.01em}
  .stack .l2{font-size:76px;font-weight:900;line-height:1.3;color:var(--vis)}
  .tape{position:absolute;left:96px;right:96px;top:868px;height:14px;background:var(--vis)}
  .tape + .tape{top:900px;opacity:.35}
  .sub{position:absolute;left:96px;top:964px;font-size:40px;font-weight:400;line-height:1.5;color:var(--chalk);max-width:760px}
  .foot{position:absolute;left:96px;bottom:112px;font-size:26px;color:var(--chalk)}
</style>
</head>
<body>
  <p class="hook">第一次夜跑，别输给天黑</p>
  <div class="seven">7</div>
  <div class="stack">
    <div class="l1">城市夜跑<br>7 件小事</div>
    <div class="l2">装备 · 路线 · 配速 · 补给</div>
  </div>
  <div class="tape"></div>
  <div class="tape"></div>
  <p class="sub">从今天晚上的第一公里开始，把夜路跑成自己的主场。</p>
  <p class="foot">夜跑清单 · 第 1 页，共 7 页</p>
</body>
</html>
