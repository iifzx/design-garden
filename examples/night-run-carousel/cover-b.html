<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面变体 B · 斜切反光带 — 城市夜跑 7 件小事</title>
<style>
  :root{
    --night:#0F1B26; --chalk:#EFF3EA; --vis:#D6F54C;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1440px;overflow:hidden}
  body{
    background:var(--night);color:var(--chalk);position:relative;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  }
  .band{
    position:absolute;left:-160px;top:430px;width:1500px;height:560px;background:var(--vis);
    transform:rotate(-6deg);display:flex;flex-direction:column;justify-content:center;
    padding:0 220px;
  }
  .band .l1{font-size:118px;font-weight:900;color:var(--night);line-height:1.18}
  .band .l2{font-size:64px;font-weight:900;color:var(--night);margin-top:16px}
  .hook{position:absolute;left:96px;top:170px;font-size:44px;font-weight:700;line-height:1.4;max-width:760px}
  .sub{position:absolute;left:96px;top:1070px;font-size:40px;line-height:1.5;max-width:780px}
  .foot{position:absolute;left:96px;bottom:112px;font-size:26px}
</style>
</head>
<body>
  <p class="hook">路灯亮起之后，<br>你需要的只是准备</p>
  <div class="band">
    <div class="l1">城市夜跑<br>7 件小事</div>
    <div class="l2">装备 · 路线 · 配速 · 补给</div>
  </div>
  <p class="sub">不追配速，不比距离——把第一周安全跑下来，夜跑就归你了。</p>
  <p class="foot">夜跑清单 · 第 1 页，共 7 页</p>
</body>
</html>
