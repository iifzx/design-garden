name: sync-plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-plugin
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Mirror runtime skill into nested plugin layout
        run: node scripts/sync_plugin.mjs
      - name: Commit mirror if changed
        run: |
          git config user.name "design-garden-sync[bot]"
          git config user.email "design-garden-sync[bot]@users.noreply.github.com"
          git add skills/design-garden
          if git diff --cached --quiet; then
            echo "mirror already up to date"
          else
            git commit -q -m "chore(sync): mirror runtime skill into skills/design-garden [skip ci]"
            git push
          fi
