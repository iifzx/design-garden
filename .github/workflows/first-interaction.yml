name: welcome-first-timers

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            🌻 Welcome, and thanks for feeding the garden! If this is a 🧠 learning report or 🌻 first bloom, a maintainer will distill it into the knowledge base — every entry makes the skill better for everyone. New here? [Start Here](https://github.com/iifzx/design-garden/blob/main/docs/start-here.md) has the zero-code contribution ladder.
          pr-message: |
            🌱 Thanks for your first PR! The CI gate (`validate-knowledge`) checks schema, line budgets, INDEX sync and injection safety — green means ready for review. One idea per PR works best; see [CONTRIBUTING.md](https://github.com/iifzx/design-garden/blob/main/CONTRIBUTING.md).
