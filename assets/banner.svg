<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="design-garden — the design skill that grows">
  <!-- garden palette: deep ink-green ground, cream type, leaf-green accent -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C3628"/>
      <stop offset="1" stop-color="#12241A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#ground)"/>

  <!-- sprout mark: stem + two leaves -->
  <g transform="translate(600,74)" fill="none" stroke="#8FBF6B" stroke-width="7" stroke-linecap="round">
    <path d="M 0 42 C 0 24 0 12 0 0"/>
    <path d="M 0 12 C -10 6 -24 6 -34 14 C -24 26 -10 26 0 12 Z" fill="#8FBF6B" stroke="none"/>
    <path d="M 0 0 C 10 -8 24 -8 34 0 C 24 12 10 12 0 0 Z" fill="#A5CE7E" stroke="none"/>
  </g>

  <text x="600" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold" fill="#F1EDE2">design-garden</text>

  <text x="600" y="212" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="20" fill="#C9D8C0">the design skill that grows · 会成长的设计技能</text>

  <!-- stat pills -->
  <g font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="15" text-anchor="middle">
    <g transform="translate(600,246)">
      <rect x="-345" y="-17" width="220" height="34" rx="17" fill="none" stroke="#3D5A48"/>
      <text x="-235" y="5" fill="#A9C4B0">9 domains</text>
      <rect x="-95" y="-17" width="190" height="34" rx="17" fill="none" stroke="#3D5A48"/>
      <text x="0" y="5" fill="#A9C4B0">18 style recipes</text>
      <rect x="125" y="-17" width="220" height="34" rx="17" fill="none" stroke="#3D5A48"/>
      <text x="235" y="5" fill="#A9C4B0">learns every task</text>
    </g>
  </g>
</svg>
