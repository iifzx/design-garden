<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>深夜冰箱 — 一台能开的四门冰箱</title>
<style>
/* ============================================================
   tokens — every color/font/spacing routes through here
   ============================================================ */
:root{
  --bg-hi:#161a18;
  --bg:#111413;
  --bg-lo:#0a0c0b;
  --text-hi:#ece8df;
  --text-mid:#a9ada7;
  --text-low:#7c817b;
  --steel-hi:#5c6468;
  --steel:#394044;
  --steel-mid:#2b3134;
  --steel-lo:#1e2326;
  --steel-edge:#0e1112;
  --streak:rgba(255,255,255,.055);
  --gold:#c5a25e;
  --gold-dim:#8c7440;
  --led:#f4e3c0;
  --warm:#ffe7bc;
  --cold:#bfdde4;
  --liner:#e7e2d6;
  --liner-lo:#cfc9bb;
  --cav:#131716;
  --cav-lo:#0d100f;
  --wood-1:#3d2f22;
  --wood-2:#2a2016;
  --wood-hi:#5a4430;
  --shell:#f2ede1;
  --yolk:#e8a33c;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-door:cubic-bezier(.3,.9,.25,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --dur-press:140ms;
  --dur-ui:260ms;
  --dur-door:640ms;
  --dur-drawer:720ms;
  --counter-h:130px;
  --font-ui:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --font-num:Georgia,"Times New Roman",serif;
}
/* ============================================================
   stage
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{
  height:100vh;height:100dvh;
  font-family:var(--font-ui);
  color:var(--text-hi);
  background:
    radial-gradient(900px 620px at 50% 8%,rgba(255,243,214,.09),transparent 62%),
    linear-gradient(180deg,var(--bg-hi) 0%,var(--bg) 46%,var(--bg-lo) 100%);
  user-select:none;-webkit-user-select:none;
  position:relative;
}
body::after{ /* vignette */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(140% 120% at 50% 40%,transparent 58%,rgba(0,0,0,.42) 100%);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.item:focus-visible,.egg:focus-visible,.door:focus-visible .face-front,
.drawerBtn:focus-visible,.counterItem:focus-visible,#soundBtn:focus-visible,#cleanBtn:focus-visible{
  outline:2px solid var(--gold);outline-offset:2px;
}
/* masthead */
.mast{position:fixed;top:30px;left:40px;z-index:20}
.mast h1{font-size:26px;font-weight:600;letter-spacing:.06em}
.mast p{margin-top:6px;font-size:13px;color:var(--text-mid);letter-spacing:.04em}
#soundBtn{
  position:fixed;top:30px;right:40px;z-index:20;
  font-size:14px;color:var(--text-mid);
  padding:10px 14px;min-height:44px;border-radius:8px;
  border:1px solid rgba(255,255,255,.14);
  transition:color var(--dur-ui) var(--ease-out),border-color var(--dur-ui) var(--ease-out);
}
#soundBtn:hover{color:var(--text-hi);border-color:rgba(255,255,255,.3)}
#soundBtn[aria-pressed="false"]{color:var(--text-low)}
/* hint — lives on the counter's front face, never over the food */
.hint{
  position:fixed;left:50%;bottom:38px;transform:translateX(-50%);
  z-index:20;font-size:14px;color:var(--text-mid);letter-spacing:.03em;
  white-space:nowrap;transition:opacity 200ms var(--ease-out);
}
.hint.dim{opacity:.35}
/* ============================================================
   scene wrapper — fridge scaled to fit, planted on the floor line
   ============================================================ */
.sceneWrap{
  position:fixed;left:50%;width:440px;height:660px;margin-left:-220px;z-index:5;
}
.scene{width:100%;height:100%;transform-origin:50% 100%;position:relative;perspective:1150px}
.floorShadow{
  position:absolute;left:50%;bottom:-6px;width:520px;height:56px;transform:translateX(-50%);
  background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.55),transparent 70%);
}
.spill{
  position:absolute;left:50%;bottom:-2px;width:560px;height:40px;transform:translateX(-50%);
  background:radial-gradient(50% 100% at 50% 0,rgba(255,229,180,.16),transparent 72%);
  opacity:0;transition:opacity 500ms var(--ease-out);pointer-events:none;
}
.spill.on{opacity:1}
/* ============================================================
   fridge body
   ============================================================ */
.fridge{
  position:absolute;inset:0;transform-style:preserve-3d;
  border-radius:16px;
  background:linear-gradient(180deg,var(--steel-mid),var(--steel-lo));
  box-shadow:
    0 0 0 1px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.14),
    inset 0 -1px 0 rgba(0,0,0,.5),
    0 18px 50px rgba(0,0,0,.5);
}
/* top band + LED display */
.topband{
  position:absolute;left:0;right:0;top:0;height:56px;
  border-radius:16px 16px 0 0;
  background:linear-gradient(180deg,var(--steel-hi),var(--steel) 70%,var(--steel-mid));
  display:flex;align-items:center;justify-content:center;
}
.topband::before{ /* brushed streaks */
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(90deg,var(--streak) 0 1px,transparent 1px 5px);
  opacity:.5;
}
.display{
  position:relative;z-index:1;width:250px;height:34px;border-radius:6px;
  background:linear-gradient(180deg,#171b1a,#101312);
  box-shadow:inset 0 0 0 1px rgba(197,162,94,.55),inset 0 2px 6px rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:13px;letter-spacing:.08em;color:var(--text-mid);
}
.display .t{display:flex;align-items:baseline;gap:6px}
.display b{font-family:var(--font-num);font-weight:400;font-size:15px;color:var(--led);letter-spacing:.06em;text-shadow:0 0 8px rgba(244,227,192,.35)}
.display .rule{width:1px;height:14px;background:rgba(197,162,94,.4)}
/* ============================================================
   french doors (true 3D: front face + liner face)
   ============================================================ */
.door{
  position:absolute;top:64px;width:212px;height:380px;
  transform-style:preserve-3d;
  transition:transform var(--dur-door) var(--ease-door);
}
.doorL{left:8px;transform-origin:left center;transform:translateZ(26px)}
.doorR{right:8px;transform-origin:right center;transform:translateZ(26px)}
.doorL.open{transform:translateZ(26px) rotateY(-104deg)}
.doorR.open{transform:translateZ(26px) rotateY(104deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;overflow:hidden}
.face-front{
  transform:translateZ(12px);
  background:
    repeating-linear-gradient(90deg,var(--streak) 0 1px,transparent 1px 6px),
    linear-gradient(105deg,var(--steel-hi) 0%,var(--steel) 30%,var(--steel-mid) 62%,var(--steel) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -1px 0 rgba(0,0,0,.45),
    inset 1px 0 0 rgba(255,255,255,.05),
    inset -1px 0 0 rgba(0,0,0,.35),
    0 6px 18px rgba(0,0,0,.35);
}
.doorR .face-front{background:
    repeating-linear-gradient(90deg,var(--streak) 0 1px,transparent 1px 6px),
    linear-gradient(255deg,var(--steel-hi) 0%,var(--steel) 30%,var(--steel-mid) 62%,var(--steel) 100%);}
/* door seam shading */
.face-front .seam{position:absolute;top:0;bottom:0;width:3px;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.25) 30%,rgba(0,0,0,.55));}
.doorL .seam{right:0}.doorR .seam{left:0}
/* vertical bar handles */
.handle{position:absolute;border-radius:9px;background:linear-gradient(90deg,#70787c,#3a4145 45%,#5c6468);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),2px 0 8px rgba(0,0,0,.45)}
.handle.v{top:86px;height:180px;width:13px}
.handle.v::before,.handle.v::after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:6px;height:3px;border-radius:2px;background:var(--gold-dim)}
.handle.v::before{top:-6px}.handle.v::after{bottom:-6px}
.doorL .handle{right:16px}.doorR .handle{left:16px}
/* ice & water dispenser on the left door */
.dispenser{
  position:absolute;left:18px;top:64px;width:54px;height:124px;border-radius:9px;
  background:linear-gradient(180deg,#14181a,#0c0f10);
  box-shadow:inset 0 0 0 1px rgba(197,162,94,.4),inset 0 3px 8px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.1);
}
.dispenser .noz{position:absolute;left:50%;top:34px;transform:translateX(-50%);width:16px;height:22px;border-radius:4px 4px 8px 8px;background:linear-gradient(180deg,#3a4145,#22282b);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.dispenser .dtray{position:absolute;left:8px;right:8px;bottom:10px;height:12px;border-radius:3px;background:#0a0d0e;box-shadow:inset 0 2px 4px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.06)}
/* inner liner face — bins live here and swing out with the door */
.face-inner{
  transform:rotateY(180deg) translateZ(12px);
  background:linear-gradient(180deg,var(--liner) 0%,var(--liner-lo) 100%);
  box-shadow:inset 0 0 24px rgba(0,0,0,.12);
}
.bin{
  position:absolute;left:14px;right:14px;height:92px;border-radius:7px;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(0,0,0,.1));
  box-shadow:inset 0 2px 5px rgba(0,0,0,.18),inset 0 -1px 0 rgba(255,255,255,.5);
}
.bin::after{content:"";position:absolute;left:6px;right:6px;bottom:5px;height:8px;border-radius:4px;background:rgba(0,0,0,.1)}
.bin1{top:78px}.bin2{top:214px}
/* ============================================================
   fresh-food cavity
   ============================================================ */
.cavity{
  position:absolute;left:8px;top:64px;width:424px;height:380px;
  border-radius:8px;overflow:hidden;
  background:linear-gradient(180deg,var(--cav) 0%,var(--cav-lo) 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6);
}
.cback{position:absolute;inset:10px 34px 10px 34px;background:linear-gradient(180deg,#1a1f1d,#101312);border-radius:4px;box-shadow:inset 0 0 30px rgba(0,0,0,.5)}
.cled{ /* warm led strip at cavity ceiling */
  position:absolute;left:26px;right:26px;top:6px;height:4px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--warm),transparent);
  filter:blur(1px);opacity:0;transition:opacity 320ms var(--ease-out);
}
.cled.on{opacity:.95}
.clight{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,231,188,.28) 0%,rgba(255,231,188,.1) 34%,transparent 72%);
  opacity:0;transition:opacity 320ms var(--ease-out);
}
.clight.on{opacity:1}
.shelf{position:absolute;left:16px;right:16px;height:7px;border-radius:3px;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.1) 55%,rgba(255,255,255,.2));
  box-shadow:0 6px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.4);
}
.shelf::after{content:"";position:absolute;left:4px;right:4px;bottom:-2px;height:1px;background:rgba(255,255,255,.18)}
.s1{top:112px}.s2{top:206px}.s3{top:300px}
.crisper{
  position:absolute;left:16px;right:16px;bottom:8px;height:58px;border-radius:7px;
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  box-shadow:inset 0 2px 6px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.1);
  overflow:hidden;
}
.crisper .veg{position:absolute;bottom:8px;border-radius:50%;filter:saturate(.85) brightness(.8)}
.crisper .v1{left:24px;width:34px;height:26px;background:radial-gradient(circle at 35% 30%,#7ba05a,#3f5a33 70%)}
.crisper .v2{left:70px;width:26px;height:22px;background:radial-gradient(circle at 35% 30%,#c97a3a,#7c4a20 70%)}
.crisper .v3{right:28px;width:44px;height:20px;background:radial-gradient(circle at 40% 30%,#8fae62,#465f38 70%);border-radius:40%}
.cslot{position:absolute;width:72px;display:flex;justify-content:center;align-items:flex-end}
/* ============================================================
   freezer drawers (slide toward the viewer)
   ============================================================ */
.fz{position:absolute;left:8px;right:8px;height:92px;transform-style:preserve-3d}
.fz1{top:452px}.fz2{top:550px}
.fzcav{
  position:absolute;inset:0;border-radius:8px;overflow:hidden;
  background:linear-gradient(180deg,#101517,#0b0e10);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 0 26px rgba(0,0,0,.55);
}
.fzcav .frost{
  position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:
    radial-gradient(3px 3px at 18% 22%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(2px 2px at 70% 16%,rgba(255,255,255,.4),transparent 60%),
    radial-gradient(3px 2px at 84% 60%,rgba(255,255,255,.35),transparent 60%),
    radial-gradient(2px 2px at 34% 74%,rgba(255,255,255,.4),transparent 60%),
    linear-gradient(180deg,rgba(191,221,228,.08),transparent 40%);
}
.fzlight{
  position:absolute;left:20px;right:20px;top:5px;height:4px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--cold),transparent);filter:blur(1px);
  opacity:0;transition:opacity 300ms var(--ease-out);
}
.fzlight.on{opacity:1}
.fzcav .fzglow{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(191,221,228,.14),transparent 55%);
  opacity:0;transition:opacity 300ms var(--ease-out);
}
.fzcav .fzglow.on{opacity:1}
.tray{position:absolute;inset:6px 12px auto;height:76px;opacity:0;transition:opacity 260ms var(--ease-out)}
.tray.on{opacity:1}
.tray .trayWall{position:absolute;top:0;bottom:0;width:6px;border-radius:3px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.tray .wL{left:0}.tray .wR{right:0}
.tray .titem{position:absolute;bottom:4px;display:flex;justify-content:center}
.drawerBtn{
  position:absolute;inset:0;border-radius:10px;
  transform:translateZ(26px);
  transition:transform var(--dur-drawer) var(--ease-drawer);
  overflow:hidden;
}
.fz1 .drawerBtn.open{transform:translateZ(236px) translateY(22px)}
.fz2 .drawerBtn.open{transform:translateZ(236px) translateY(22px)}
.dfront{
  position:absolute;inset:0;border-radius:10px;overflow:hidden;
  background:
    repeating-linear-gradient(90deg,var(--streak) 0 1px,transparent 1px 6px),
    linear-gradient(180deg,var(--steel) 0%,var(--steel-mid) 55%,var(--steel-lo) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.5),0 8px 20px rgba(0,0,0,.4);
}
.dfront .handle{left:50%;top:30px;width:200px;height:12px;transform:translateX(-50%)}
.dfront .fzlabel{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  font-size:10px;letter-spacing:.35em;color:rgba(255,255,255,.3);text-indent:.35em;
}
/* ============================================================
   fog — rolls out of an opening
   ============================================================ */
.fogLayer{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:7}
.fog{
  position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%,rgba(222,238,242,.6) 0%,rgba(222,238,242,.34) 30%,rgba(222,238,242,.13) 56%,transparent 76%);
  will-change:transform,opacity;
}
/* ============================================================
   counter (foreground island)
   ============================================================ */
.counter{position:fixed;left:0;right:0;bottom:0;height:var(--counter-h);z-index:10}
.counter .ctop{
  position:absolute;left:0;right:0;top:0;height:10px;
  background:linear-gradient(180deg,var(--wood-hi),var(--wood-1));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 -1px 0 rgba(0,0,0,.4);
}
.counter .cface{
  position:absolute;left:0;right:0;top:10px;bottom:0;overflow:hidden;
  background:
    repeating-linear-gradient(178deg,transparent 0 62px,rgba(0,0,0,.14) 62px 64px),
    linear-gradient(180deg,var(--wood-1) 0%,var(--wood-2) 70%,#1c150e 100%);
}
.counter .cface::before{ /* horizontal grain */
  content:"";position:absolute;inset:0;opacity:.4;
  background:repeating-linear-gradient(178deg,transparent 0 14px,rgba(255,255,255,.045) 14px 15px,transparent 15px 46px),repeating-linear-gradient(176deg,transparent 0 90px,rgba(0,0,0,.12) 90px 93px);
}
.counter .cface::after{ /* front edge shadow */
  content:"";position:absolute;left:0;right:0;top:0;height:8px;
  background:linear-gradient(180deg,rgba(0,0,0,.5),transparent);
}
#cleanBtn{
  position:absolute;right:28px;top:calc(var(--counter-h) / 2 - 16px);z-index:5;
  min-height:44px;padding:10px 18px;border-radius:9px;
  font-size:14px;letter-spacing:.06em;color:var(--text-hi);
  background:rgba(20,24,22,.72);
  box-shadow:inset 0 0 0 1px rgba(197,162,94,.55),0 4px 14px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transform:translateY(6px);
  transition:opacity var(--dur-ui) var(--ease-out),transform var(--dur-ui) var(--ease-out);
}
#cleanBtn.show{opacity:1;pointer-events:auto;transform:none}
#cleanBtn:active{transform:scale(.97)}
/* items & messes standing on the counter top edge */
.counterRow{position:absolute;inset:0;pointer-events:none}
.counterItem{position:absolute;pointer-events:auto;transform-origin:50% 100%;display:flex;align-items:flex-end;justify-content:center}
.counterItem .art{transform:scale(.92)}
.counterItem.wrecked{pointer-events:none}
.counterItem.pouring{transition:transform 900ms var(--ease-out)}
.counterItem.pourTilt{transform:rotate(-30deg) translateY(-2px)}
.mess{position:absolute;pointer-events:none}
.puddle{height:13px;border-radius:50%;transform:scale(.12);filter:blur(.4px);transition:transform 700ms var(--ease-out)}
.drip{width:3px;top:12px;border-radius:0 0 2px 2px;transform:scaleY(.06);transform-origin:top;transition:transform 1300ms var(--ease-out) 350ms}
.stream{position:absolute;width:5px;border-radius:3px;transform-origin:top;transform:scaleY(0);transition:transform 200ms var(--ease-out)}
/* ============================================================
   fx particle layer
   ============================================================ */
#fx{position:fixed;inset:0;z-index:40;pointer-events:none}
.p{position:fixed;left:0;top:0;will-change:transform;border-radius:50%}
.p-shell{background:linear-gradient(145deg,var(--shell) 40%,#d8d2c2);border-radius:60% 40% 55% 45%/55% 60% 40% 45%;box-shadow:inset 0 -2px 3px rgba(0,0,0,.12)}
.p-yolk{background:radial-gradient(circle at 40% 35%,#f2b23c,var(--yolk) 60%,#cf7d1e)}
.p-white{background:radial-gradient(circle at 40% 35%,#ffffff,#e8e4d8 70%)}
.p-chip{background:linear-gradient(160deg,#f0be5e,#d9993a);border-radius:60% 40% 60% 40%/50% 60% 40% 50%;box-shadow:inset 0 -1px 2px rgba(0,0,0,.2)}
.p-crumb{background:#8a6a3a}
.p-foam{background:radial-gradient(circle at 40% 35%,#ffffff,rgba(255,255,255,.75) 60%,rgba(255,255,255,.2))}
.p-cube{background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(205,228,234,.85));border-radius:22%}
.p-juice{background:radial-gradient(circle at 40% 35%,#f06a45,#c73a1d 70%)}
.p-drop{background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.9),rgba(255,255,255,.4))}
.p-seed{background:#f5e9c8;border-radius:40%}
.p-dump{background:linear-gradient(160deg,#f4ecdc,#ddd2ba);border-radius:46% 54% 50% 50%/60% 60% 42% 42%;box-shadow:inset 0 -2px 3px rgba(0,0,0,.12)}
.p-cap{background:linear-gradient(145deg,#e3c37e,var(--gold) 55%,#a3813f);border-radius:50%;box-shadow:inset 0 -2px 3px rgba(0,0,0,.25),inset 0 1px 1px rgba(255,255,255,.5)}
.p-slice{background:linear-gradient(160deg,#f2cf6e,#dcab3c);border-radius:14% 60% 60% 14%/20% 50% 50% 20%}
.p-leaf{background:linear-gradient(160deg,#9fbf72,#5d7f45);border-radius:60% 40% 60% 40%/60% 50% 50% 40%}
/* wreck leftovers that stay on the counter */
.w-half{position:absolute;width:20px;height:15px;background:linear-gradient(145deg,var(--shell) 55%,#d8d2c2);border-radius:55% 45% 50% 50%/70% 70% 30% 30%;box-shadow:inset 0 -2px 2px rgba(0,0,0,.14)}
.w-yolk{position:absolute;width:24px;height:13px;border-radius:50%;background:radial-gradient(circle at 42% 32%,#f2b23c,var(--yolk) 58%,#cf7d1e);box-shadow:inset 0 1px 1px rgba(255,255,255,.4)}
/* ============================================================
   item art — CSS-drawn food
   ============================================================ */
.item{position:relative;width:72px;height:78px;display:flex;align-items:flex-end;justify-content:center;background:none;padding:0 4px 4px;transition:transform var(--dur-press) var(--ease-out),filter var(--dur-press) var(--ease-out)}
.item::after{ /* contact shadow */
  content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:54px;height:8px;border-radius:50%;background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.4),transparent 70%);
}
.item:hover{filter:brightness(1.1)}

<script>
"use strict";
/* ============================================================
   helpers
   ============================================================ */
const $=s=>document.querySelector(s);
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const hintEl=$("#hint"), fx=$("#fx"), scene=$("#scene"), sceneWrap=$("#sceneWrap");
let hintText="";
function hint(t){
  if(t===hintText)return; hintText=t;
  hintEl.style.opacity=0;
  setTimeout(()=>{hintEl.textContent=t;hintEl.style.opacity="";},180);
}
function el(cls,parent){const d=document.createElement("div");d.className=cls;if(parent)parent.appendChild(d);return d}

/* ============================================================
   layout — scale fridge to fit, keep it planted above the counter
   ============================================================ */
const counterEl=document.querySelector(".counter");
let SC=1;
function counterTop(){return counterEl.getBoundingClientRect().top}
function layout(){
  const vw=innerWidth,vh=innerHeight;
  const ch=vh<760?112:130;
  document.documentElement.style.setProperty("--counter-h",ch+"px");
  const ct=vh-ch;
  const s=Math.min(1,(vw-28)/456,(ct-92)/660);
  SC=s;
  scene.style.transform="scale("+s+")";
  sceneWrap.style.top=(ct-42-660)+"px";
}
addEventListener("resize",layout);layout();

/* ============================================================
   sound — tiny WebAudio synth, no files
   ============================================================ */
let AC=null,master=null,muted=false,nBuf=null;
function ac(){
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.2;master.connect(AC.destination);}
    if(AC.state==="suspended")AC.resume();
    return AC;
  }catch(e){return null}
}
function noise(dur){
  const c=ac();if(!c)return null;
  if(!nBuf||nBuf.duration<dur){
    nBuf=c.createBuffer(1,c.sampleRate*1.5,c.sampleRate);
    const d=nBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  const src=c.createBufferSource();src.buffer=nBuf;return src;
}
function playN(o){ // filtered noise burst
  const c=ac();if(!c||muted)return;
  const src=noise(o.dur||.2);if(!src)return;
  const f=c.createBiquadFilter();f.type=o.type||"bandpass";f.frequency.value=o.f||1000;f.Q.value=o.q||1;
  if(o.f1)f.frequency.exponentialRampToValueAtTime(o.f1,c.currentTime+(o.dur||.2));
  const g=c.createGain();g.gain.setValueAtTime(0,c.currentTime);
  g.gain.linearRampToValueAtTime(o.g||.3,c.currentTime+(o.a||.01));
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+(o.dur||.2));
  src.connect(f);f.connect(g);g.connect(master);src.start();src.stop(c.currentTime+(o.dur||.2)+.05);
}
function tone(o){
  const c=ac();if(!c||muted)return;
  const os=c.createOscillator();os.type=o.w||"sine";os.frequency.value=o.f||80;
  const g=c.createGain();g.gain.setValueAtTime(0,c.currentTime);
  g.gain.linearRampToValueAtTime(o.g||.4,c.currentTime+(o.a||.008));
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+(o.dur||.2));
  os.connect(g);g.connect(master);os.start();os.stop(c.currentTime+(o.dur||.2)+.05);
}
const S={
  door(){tone({f:64,dur:.22,g:.5});playN({dur:.28,f:520,f1:180,type:"lowpass",g:.14})},
  close(){tone({f:88,dur:.16,g:.55});playN({dur:.05,f:2400,q:6,g:.2})},
  drawer(){playN({dur:.4,f:420,f1:900,type:"bandpass",g:.12});tone({f:110,dur:.14,g:.3})},
  pick(){tone({f:640,dur:.06,g:.08,w:"triangle"})},
  crack(){playN({dur:.06,f:3200,q:5,g:.5});setTimeout(()=>playN({dur:.1,f:1800,q:3,g:.4}),50);setTimeout(()=>playN({dur:.16,f:500,f1:200,type:"lowpass",g:.25}),110)},
  tear(){for(let i=0;i<5;i++)setTimeout(()=>playN({dur:.045,f:2200+Math.random()*900,q:4,g:.3}),i*38)},
  spray(){playN({dur:.9,f:3800,f1:2200,type:"highpass",g:.3,a:.03})},

const doorL=$("#doorL"),doorR=$("#doorR");
function anyOpen(){return doorL.classList.contains("open")||doorR.classList.contains("open")||$("#drawer1").classList.contains("open")||$("#drawer2").classList.contains("open")}
function allClosed(){return !anyOpen()}
const fogs=[];
function spawnFog(hostRect,cool){
  if(RM)return;
  const layer=$("#fogLayer"),sr=scene.getBoundingClientRect();
  const lo=doorL.classList.contains("open"),ro=doorR.classList.contains("open");
  let x0=0.15,x1=0.85;
  if(lo&&!ro){x0=0.42;x1=0.92}
  if(ro&&!lo){x0=0.08;x1=0.58}
  for(let i=0;i<3;i++){
    setTimeout(()=>{
      const f=el("fog",layer);
      const w=120+Math.random()*90,h=70+Math.random()*50;
      f.style.width=w+"px";f.style.height=h+"px";
      const x=(hostRect.left+hostRect.width*(x0+Math.random()*(x1-x0))-w/2*SC-sr.left)/SC;
      const y=(hostRect.top+hostRect.height*(0.35+Math.random()*0.4)-h/2*SC-sr.top)/SC;
      f.style.left=x+"px";f.style.top=y+"px";
      if(cool)f.style.background="radial-gradient(50% 50% at 50% 50%,rgba(191,221,228,.5),rgba(191,221,228,.15) 55%,transparent 75%)";
      fogs.push({el:f,t0:performance.now(),dur:1400+Math.random()*400,dx:Math.random()*56-28,dy:56+Math.random()*44,sc:1.18+Math.random()*.3});
      if(!fogRaf)fogRaf=requestAnimationFrame(fogStep);
    },i*95);
  }
}
let fogRaf=null;
function fogStep(){
  const now=performance.now();
  for(let i=fogs.length-1;i>=0;i--){
    const p=fogs[i];
    const k=Math.min(1,(now-p.t0)/p.dur);
    if(k>=1){p.el.remove();fogs.splice(i,1);continue}
    const hold=k<.4?0:Math.pow((k-.4)/.6,1.5);
    p.el.style.opacity=(0.8*(1-hold)).toFixed(3);
    p.el.style.transform="translate("+(p.dx*k)+"px,"+(p.dy*k)+"px) scale("+(0.7+0.5*k)+")";
  }
  fogRaf=fogs.length?requestAnimationFrame(fogStep):null;
}

const counterRow=$("#counterRow");

function nextX(){
  const vw=innerWidth,cx=vw/2;

  for(let k=0;k<12;k++){
    const x=cx+((k%2? -1:1)*Math.ceil(k/2))*step;
    if(!occupied.some(o=>Math.abs(o-x)<step-6)&&x>110&&x<vw-110)return x;
  }
  return cx;
}
function flyToCounter(ci,src){
  const x=parseInt(ci.style.left)+36;

    {transform:"translate(0,0) scale(1)",opacity:1}

/* ============================================================
   particle engine — gravity, bounce, settle
   ============================================================ */
const parts=[];let rafId=null;
function floorY(){return counterTop()+2}
function step(){
  const fy=floorY();
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.vy+=p.g;p.vx*=p.drag;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
    if(p.y>fy){
      p.y=fy;
      if(Math.abs(p.vy)>40){p.vy*=-p.rest;p.vx*=.72;p.vr*=.6}
      else{p.vy=0;p.vx*=.86;p.vr=0;
        if(Math.abs(p.vx)<6){parts.splice(i,1);if(p.done)p.done();continue}}
    }
    if(p.life&&p.life--<=0){p.el.remove();parts.splice(i,1);continue}
    p.el.style.transform="translate3d("+p.x+"px,"+p.y+"px,0) rotate("+p.rot+"deg) scale("+(p.sc||1)+")";
  }
  if(parts.length)rafId=requestAnimationFrame(step);else rafId=null;
}
function spawn(o){
  const e=el("p "+o.cls,fx);
  const s=o.size||8;
  e.style.width=s+"px";e.style.height=(o.sh||s)+"px";
  e.style.opacity=o.op!=null?o.op:1;
  parts.push({el:e,x:o.x,y:o.y,vx:o.vx||0,vy:o.vy||0,g:o.g!=null?o.g:.55,rot:o.rot||0,vr:o.vr||0,drag:o.drag||.995,rest:o.rest||.42,life:o.life||0,sc:o.sc||1,done:o.done});
  if(!rafId)rafId=requestAnimationFrame(step);
}
function burst(x,y,o){
  if(RM)return;
  const n=o.n||10;
  for(let i=0;i<n;i++){
    const a=(o.dir!=null?o.dir:-90+ (Math.random()*120-60))*Math.PI/180;
    const sp=(o.sp||5)+Math.random()*(o.spr||4);
    spawn({cls:o.cls,x:x+(Math.random()*16-8),y:y+(Math.random()*6-3),
      vx:Math.cos(a)*sp*(0.7+Math.random()*.6),vy:Math.sin(a)*sp*(0.8+Math.random()*.5),
      g:o.g!=null?o.g:.55,vr:(Math.random()*400-200),size:o.size||8,sh:o.sh,drag:.99,rest:o.rest||.42,life:o.life||0,sc:o.sc});
  }
}

/* ============================================================
   counter mess helpers
   ============================================================ */
function messAt(x,w,html,extra){ // mess wrapper on counter top edge
  const m=el("mess",counterRow);
  m.style.cssText="bottom:calc(var(--counter-h) - 6px);left:"+(x-w/2)+"px;width:"+w+"px;height:20px;"+(extra||"");
  if(html)m.innerHTML=html;
  return m;
}
function puddle(x,w,c,slow){
  const p=messAt(x,w,"");
  p.className="mess puddle";
  p.style.background="radial-gradient(ellipse at 50% 42%,"+c+" 0%,transparent 78%)";
  p.style.width=w+"px";p.style.height="13px";
  requestAnimationFrame(()=>{p.style.transitionDuration=slow?(slow+"ms"):"700ms";p.style.transform="scale(1)"});
  return p;
}
function drip(x,c){
  const d=el("mess drip",counterRow);
  d.style.cssText+=";left:"+(x-1)+"px;height:52px;width:3px;background:linear-gradient(180deg,"+c+",transparent)";
  requestAnimationFrame(()=>{d.style.transform="scaleY(1)"});
  setTimeout(()=>{d.style.transition="opacity 400ms var(--ease-out)";d.style.opacity=".55"},1700);
}
function updateClean(){
  const has=counterRow.querySelector(".counterItem,.puddle,.w-half,.w-yolk,.drip,.mess:not(.puddle):not(.drip)");
  $("#cleanBtn").classList.toggle("show",!!has);
}
$("#cleanBtn").addEventListener("click",()=>{
  S.wipe();
  const kids=[...counterRow.children,...fx.children];
  kids.forEach((k,i)=>{
    k.style.transition="opacity 240ms var(--ease-out),transform 240ms var(--ease-out)";
    k.style.transitionDelay=(i*22)+"ms";
    k.style.opacity="0";k.style.transform=(k.style.transform||"")+" translateY(10px)";
  });
  setTimeout(()=>{kids.forEach(k=>k.remove());occupied=[];updateClean()},240+kids.length*22+60);
});

/* ============================================================
   effects — the food's fate
   ============================================================ */
function wreck(ci){ci.classList.add("wrecked");ci.setAttribute("aria-disabled","true")}
function centerOf(ci){const r=ci.getBoundingClientRect();return{x:r.left+r.width/2,y:counterTop()-8}}
function smashEgg(ci){
  wreck(ci);S.crack();
  const c=centerOf(ci);
  ci.animate([{transform:"translate(0,0) rotate(0)"},{transform:"translate(6px,-6px) rotate(-8deg)"},{transform:"translate(14px,0) rotate(5deg)"}],
    {duration:230,easing:"ease-out"}).onfinish=()=>{
    ci.style.opacity="0";
    // shell halves stay
    const halves=messAt(c.x,40,
      '<span class="w-half" style="left:2px;bottom:4px;transform:rotate(-16deg)"></span>'+
      '<span class="w-half" style="left:20px;bottom:3px;transform:rotate(22deg) scaleX(-1)"></span>');
    halves.style.height="22px";
    // shards fly
    burst(c.x,c.y,{cls:"p-shell",n:9,sp:6.5,spr:3.5,size:9,sh:7,dir:-75,g:.5});
    burst(c.x,c.y,{cls:"p-white",n:5,sp:3,spr:2,size:7,dir:-85,g:.6,op:.9});
    setTimeout(()=>{
      puddle(c.x+4,86,"rgba(232,163,60,.95)");
      puddle(c.x-14,56,"rgba(240,236,226,.85)");
      drip(c.x+8,"rgba(232,163,60,.75)");drip(c.x-10,"rgba(240,236,226,.6)");
    },RM?0:180);
    setTimeout(()=>{ci.remove();updateClean()},RM?80:340);
    hint("关上门，再来一轮——今晚和昨晚不一样");
  };
}
function applyEffect(ci,id){
  const cat=CATALOG[id],c=centerOf(ci);
  wreck(ci);
  switch(cat.eff){
    case "smash": // whole carton on counter: crack one egg out of it
      ci.innerHTML='<div class="art a-egg"><span class="carton"></span></div>';
      setTimeout(()=>smashEgg2(ci),RM?0:160);break;
    case "pour":{
      ci.classList.add("pouring");
      if(id==="milk")ci.querySelector(".a-milk")?.classList.add("opened");
      ci.classList.add("pourTilt");
      S.pour();
      setTimeout(()=>{
        const st=el("stream",counterRow);
        st.style.cssText+=";left:"+(c.x+13)+"px;bottom:calc(var(--counter-h) - 8px);height:46px;width:5px;background:linear-gradient(180deg,"+cat.c+",transparent)";
        requestAnimationFrame(()=>{st.style.transform="scaleY(1)"});
        puddle(c.x+13,80,cat.c.replace(/,\d?\.\d+\)/,",.55)")||cat.c);
        drip(c.x+13,cat.c);
      },RM?0:340);
      setTimeout(()=>{
        counterRow.querySelectorAll(".stream").forEach(s=>{s.style.transform="scaleY(0)";setTimeout(()=>s.remove(),260)});
        ci.classList.remove("pourTilt");
      },RM?200:1900);
      setTimeout(()=>hint("关上门，再来一轮——今晚和昨晚不一样"),RM?300:2100);
      break;}
    case "tear":{
      S.tear();
      ci.querySelector(".a-chips,.a-dumpling")?.classList.add("teared");
      const kind=cat.kind;
      setTimeout(()=>{
        if(kind==="chips"){
          burst(c.x,c.y-6,{cls:"p-chip",n:6,sp:4.5,spr:3,size:11,sh:8,dir:-70,g:.5});
          burst(c.x,c.y-6,{cls:"p-crumb",n:7,sp:3.5,spr:2,size:4,dir:-80,g:.6});
        }else{
          burst(c.x,c.y-6,{cls:"p-dump",n:5,sp:4,spr:2.5,size:13,sh:10,dir:-70,g:.55});
        }
      },RM?0:220);
      setTimeout(()=>hint("关上门，再来一轮——今晚和昨晚不一样"),RM?300:900);
      break;}
    case "spray":{
      ci.animate([{transform:"translate(0) rotate(0)"},{transform:"translate(-3px) rotate(-4deg)"},{transform:"translate(3px) rotate(4deg)"},{transform:"translate(0) rotate(0)"}],
        {duration:RM?60:520,iterations:2,easing:"ease-in-out"});
      setTimeout(()=>{
        S.spray();
        if(!RM)for(let i=0;i<16;i++){
          spawn({cls:"p-foam",x:c.x+(Math.random()*10-5),y:c.y-14,vx:Math.random()*3-1.5,vy:-(2.5+Math.random()*3),
            g:.4,size:5+Math.random()*7,life:40+Math.random()*24,drag:.985});
        }
        puddle(c.x,64,"radial-gradient(ellipse at 50% 42%,rgba(255,255,255,.6) 0%,rgba(255,255,255,.25) 50%,transparent 72%)");
        drip(c.x+4,"rgba(255,255,255,.4)");
      },RM?60:600);
      setTimeout(()=>hint("关上门，再来一轮——今晚和昨晚不一样"),RM?300:1800);
      break;}
    case "melt":{
      S.pop();
      const lid=ci.querySelector(".tlid");if(lid)lid.style.opacity=".25";
      if(!RM)burst(c.x,c.y-18,{cls:"p-cap",n:1,sp:3,spr:1,size:12,sh:5,dir:-80,g:.5,rest:.3});
      setTimeout(()=>{
        puddle(c.x,74,cat.c,5200);
        drip(c.x,"rgba(246,236,214,.6)");drip(c.x-8,"rgba(246,236,214,.45)");
        ci.querySelector(".tub")?.animate([{transform:"scaleY(1)"},{transform:"scaleY(.9)"}],{duration:5200,fill:"forwards",easing:"ease-in-out"});
      },RM?0:500);
      setTimeout(()=>hint("关上门，再来一轮——今晚和昨晚不一样"),RM?300:1200);
      break;}
    case "cubes":{
      ci.animate([{transform:"rotate(0)"},{transform:"rotate(-16deg)"}],{duration:RM?60:300,fill:"forwards",easing:"ease-out"});
      S.pop();
      if(!RM)for(let i=0;i<7;i++){
        spawn({cls:"p-cube",x:c.x,y:c.y-8,vx:(Math.random()*7-3.5)*(i%2?-1:1),vy:-(1+Math.random()*2),
          g:.5,size:11+Math.random()*5,sh:10,vr:Math.random()*260-130,
          done(){
            const px=this.x,py=this.y;
            this.el.animate([{opacity:1,transform:getComputedStyle(this.el).transform+" scale(1)"},{opacity:.5,transform:getComputedStyle(this.el).transform+" scale(.45)"}],
              {duration:7000,fill:"forwards",delay:600,easing:"linear"});
            setTimeout(()=>{puddle(px,40,"rgba(191,221,228,.5)");this.el.remove();updateClean()},7800);
          }});
      }
      else{puddle(c.x,60,"radial-gradient(ellipse at 50% 42%,rgba(191,221,228,.5) 0%,transparent 72%)")}
      setTimeout(()=>{ci.remove();updateClean()},RM?100:600);
      setTimeout(()=>hint("关上门，再来一轮——今晚和昨晚不一样"),RM?300:1000);
      break;}
    case "bite":{
      const slice=ci.querySelector(".slice");if(!slice)break;
      ci._bites=ci._bites||[];
      const bites=ci._bites;
      const doBite=()=>{
        bites.push([18+Math.random()*26,10+Math.random()*16,9+Math.random()*5]);
        const mask=bites.map(b=>"radial-gradient(circle "+b[2]+"px at "+b[0]+"px "+b[1]+"px,transparent 96%,#000 100%)").join(",");
        slice.style.webkitMaskImage=mask;slice.style.maskImage=mask;
        S.pop();
        if(!RM)burst(c.x,c.y-14,{cls:"p-crumb",n:4,sp:2.5,spr:1.5,size:4,dir:-80,g:.6});
        if(bites.length>=3){
          setTimeout(()=>{ci.animate([{opacity:1},{opacity:0}],{duration:240,fill:"forwards"}).onfinish=()=>{ci.remove();updateClean()}},420);
        }else{
          ci.classList.remove("wrecked");ci.removeAttribute("aria-disabled");
        }
        hint(bites.length<3?"还剩 "+(3-bites.length)+" 口":"关上门，再来一轮——今晚和昨晚不一样");
      };
      doBite();break;}
    case "lidpop":{
      S.pop();
      const lid=ci.querySelector(".lid");if(lid)lid.style.opacity=".15";
      if(!RM)burst(c.x,c.y-20,{cls:"p-cap",n:1,sp:4,spr:1,size:13,sh:6,dir:-78,g:.5,rest:.35});
      setTimeout(()=>hint("盖子开了——再关上门，再来一轮"),RM?300:700);
      break;}
    case "slice":{
      S.pop();
      const w=ci.querySelector(".wedge");if(w)w.style.clipPath="polygon(0 100%,0 34%,64% 16%,100% 100%)";
      const m=messAt(c.x+30,26,'<span class="p-slice" style="position:absolute;left:0;bottom:4px;width:22px;height:11px;transform:rotate(8deg)"></span>');
      m.style.height="18px";
      setTimeout(()=>hint("切下一角——关上门，再来一轮"),RM?300:700);
      break;}
    case "splat":{
      const art=ci.querySelector(".art");
      if(art){art.classList.add("squished")}
      S.pop();
      if(!RM)burst(c.x,c.y-8,{cls:"p-juice",n:8,sp:4,spr:3,size:6,dir:-80,g:.55,life:0});
      puddle(c.x,72,cat.c.replace(/,\d?\.\d+\)/,",.55)")||cat.c);
      drip(c.x+6,cat.c);
      if(id==="tomato")burst(c.x,c.y-8,{cls:"p-seed",n:4,sp:3,spr:2,size:4,dir:-85,g:.6});
      setTimeout(()=>hint("关上门，再来一轮——今晚和昨晚不一样"),RM?300:900);
      break;}
  }
  updateClean();
}
function smashEgg2(ci){ // carton clicked on counter: one egg cracks beside it
  const c=centerOf(ci);
  S.crack();
  burst(c.x+22,c.y,{cls:"p-shell",n:9,sp:6,spr:3,size:9,sh:7,dir:-75,g:.5});
  setTimeout(()=>{
    puddle(c.x+22,80,"rgba(232,163,60,.95)");
    puddle(c.x+6,52,"rgba(240,236,226,.85)");
    drip(c.x+24,"rgba(232,163,60,.75)");
    const halves=messAt(c.x+22,40,'<span class="w-half" style="left:2px;bottom:4px;transform:rotate(-16deg)"></span><span class="w-half" style="left:20px;bottom:3px;transform:rotate(20deg) scaleX(-1)"></span>');
    halves.style.height="22px";
    hint("关上门，再来一轮——今晚和昨晚不一样");
  },RM?0:160);
}

/* ============================================================
   debug states for screenshots: #open #counter #drawer
   ============================================================ */
const dbg=location.hash.replace("#","");
function debugPreset(){
  if(dbg==="open"||dbg==="smash"||dbg==="counter"){
    restockPending=false;restock();
    openDoor(doorL,true);openDoor(doorR,true);
  }
  if(dbg==="drawer"){
    restockPending=false;restock();
    openDrawer($("#drawer1"),$("#tray1"),$("#fzlight1"));
    openDoor(doorL,true);
  }
  if(dbg==="counter"){
    ["milk","chips","soda","cake","tomato"].forEach(id=>{
      const x=nextX();occupied.push(x);
      const ci=document.createElement("button");
      ci.className="counterItem";ci.dataset.id=id;ci.dataset.eff=CATALOG[id].eff;
      ci.style.cssText="bottom:calc(var(--counter-h) - 6px);left:"+(x-36)+"px;width:72px;height:84px";
      ci.innerHTML=artHTML(id);counterRow.appendChild(ci);
      ci.addEventListener("click",()=>{if(!ci.classList.contains("wrecked"))applyEffect(ci,id)});
    });
    const eggCi=document.createElement("button");
    eggCi.className="counterItem";
    eggCi.style.cssText="bottom:calc(var(--counter-h) - 6px);left:"+(nextX()-36)+"px;width:72px;height:84px";
    eggCi.innerHTML='<div class="art" style="width:26px;height:30px"><span style="position:absolute;inset:0;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;background:radial-gradient(circle at 38% 28%,#fffdf6,#e7e0cd 68%,#cfc7b0);box-shadow:inset -2px -3px 4px rgba(0,0,0,.12)"></span></div>';
    counterRow.appendChild(eggCi);
    smashEgg(eggCi);
  }
}
if(dbg)setTimeout(debugPreset,400);
</script>
